<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ESCAPE — 색을 되찾아라</title>
<meta name="description" content="색을 잃어버린 세계에서 일곱 색을 되찾는 게임">
<meta name="theme-color" content="#04050a">
<meta name="color-scheme" content="dark">
<!-- 홈 화면에 추가하면 주소창 없이 전체화면으로 실행된다 -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ESCAPE">
<meta name="format-detection" content="telephone=no">
<!-- 링크 공유 시 미리보기 -->
<meta property="og:title" content="ESCAPE — 색을 되찾아라">
<meta property="og:description" content="어두운 세계에서 일곱 색을 되찾는 짧은 게임">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 64 64\'%3E%3Crect width=\'64\' height=\'64\' fill=\'%2304050a\'/%3E%3Ccircle cx=\'32\' cy=\'36\' r=\'15\' fill=\'%23f4f0e4\'/%3E%3Ccircle cx=\'26\' cy=\'33\' r=\'3.4\' fill=\'%23252836\'/%3E%3Ccircle cx=\'38\' cy=\'33\' r=\'3.4\' fill=\'%23252836\'/%3E%3Cpath d=\'M32 39 l3 4 -3 4 -3 -4z\' fill=\'%23e8a24e\'/%3E%3C/svg%3E">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html, body { width:100%; height:100%; overflow:hidden; background:#04050a; font-family:'Space Grotesk',sans-serif;
    touch-action:manipulation; overscroll-behavior:none; position:fixed; top:0; left:0;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  html, body, #gameCanvas, button { touch-action:none; }
  #gameCanvas { display:block; width:100vw; height:100vh; background:#04050a; }
  .overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
    background:radial-gradient(circle at 50% 42%, rgba(20,24,40,.92) 0%, rgba(4,5,10,.98) 70%);
    color:#f4ede0; text-align:center; padding:24px; z-index:10; transition:opacity .35s ease; }
  .overlay.hidden { opacity:0; pointer-events:none; }
  .title { font-size:clamp(38px,11vw,56px); font-weight:700; letter-spacing:.14em; text-shadow:0 0 28px rgba(127,231,196,.35); }
  .tagline { font-size:14px; letter-spacing:.08em; color:#8b8a9a; max-width:280px; line-height:1.6; }
  .resultLabel { font-size:clamp(30px,9vw,44px); font-weight:700; letter-spacing:.06em; }
  .resultLabel.fail { color:#ff6b6b; text-shadow:0 0 24px rgba(255,107,107,.4); }
  .resultLabel.success { color:#ffd166; text-shadow:0 0 24px rgba(255,209,102,.45); }
  .statLine { font-family:'JetBrains Mono',monospace; font-size:13px; letter-spacing:.05em; color:#7c7b8c; }
  .statLine b { color:#f4ede0; font-weight:500; }
  .tapBtn { margin-top:8px; padding:15px 38px; border-radius:999px; border:1px solid rgba(244,237,224,.25);
    background:rgba(244,237,224,.06); color:#f4ede0; font-family:'Space Grotesk',sans-serif; font-size:15px;
    letter-spacing:.08em; font-weight:500; backdrop-filter:blur(6px); }
  .tapBtn:active { background:rgba(244,237,224,.16); }
  #hud { position:fixed; top:0; left:0; right:0; padding:max(16px,env(safe-area-inset-top)) 20px 0 20px;
    display:flex; justify-content:space-between; align-items:flex-start; font-family:'JetBrains Mono',monospace;
    color:#9a97ad; font-size:12px; letter-spacing:.08em; pointer-events:none; z-index:5; opacity:0; transition:opacity .4s ease; }
  #hud.visible { opacity:1; }
  #hud .timeVal { color:#f4ede0; font-size:15px; font-weight:500; }
  #pauseBtn { position:fixed; z-index:6; right:16px; bottom:max(20px,env(safe-area-inset-bottom));
    width:46px; height:46px; border-radius:50%; border:1px solid rgba(244,237,224,.22);
    background:rgba(20,24,36,.55); backdrop-filter:blur(6px); display:none;
    align-items:center; justify-content:center; }
  #pauseBtn.on { display:flex; }
  #pauseBtn i { display:block; width:4px; height:15px; background:#e6e2d6; margin:0 2.5px; border-radius:2px; }
  #muteBtn { position:fixed; z-index:6; right:70px; bottom:max(20px,env(safe-area-inset-bottom));
    width:46px; height:46px; border-radius:50%; border:1px solid rgba(244,237,224,.18);
    background:rgba(20,24,36,.45); backdrop-filter:blur(6px); display:none;
    align-items:center; justify-content:center; color:#cfcabb; font-size:15px;
    font-family:'Space Grotesk',sans-serif; }
  #muteBtn.on { display:flex; }
  #muteBtn.off { color:#6d6a78; }
  #tip { position:fixed; left:0; right:0; bottom:14%; z-index:6; text-align:center; pointer-events:none;
    font-size:14.5px; line-height:1.55; letter-spacing:.02em; color:#f2eee2; opacity:0;
    transition:opacity .5s ease; padding:0 34px; text-shadow:0 2px 12px rgba(0,0,0,.9), 0 0 30px rgba(0,0,0,.8); }
  #tip.on { opacity:1; }
  .resRow { font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.14em; color:#77758a; }
  .resRow b { display:block; color:#f4ede0; font-size:26px; font-weight:500; letter-spacing:.02em; margin-top:3px; }
  .resGrid { display:flex; gap:34px; justify-content:center; }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="hud">
  <div>TIME<br><span class="timeVal" id="timeVal">0.0s</span></div>
  <div style="text-align:right;">BEST<br><span class="timeVal" id="bestVal">–</span></div>
</div>

<div class="overlay" id="startOverlay">
  <div class="title">ESCAPE</div>
  <div class="tagline">보이지 않는 세상 속에서<br>모든 빛을 지나가라</div>
  <button class="tapBtn" id="startBtn">터치해서 시작</button>
</div>

<div class="overlay hidden" id="resultOverlay">
  <div class="resultLabel" id="resultLabel">GAME OVER</div>
  <div class="resGrid">
    <div class="resRow">TIME<b id="resTime">00:00</b></div>
    <div class="resRow" id="bestWrap">BEST<b id="resBest">--:--</b></div>
  </div>
  <div class="statLine" id="resultStat"></div>
  <button class="tapBtn" id="retryBtn">RETRY</button>
</div>

<div class="overlay hidden" id="pauseOverlay">
  <div class="resultLabel" style="color:#e6e2d6;font-size:30px;">PAUSED</div>
  <button class="tapBtn" id="resumeBtn">RESUME</button>
  <button class="tapBtn" id="pRetryBtn" style="margin-top:2px;">RETRY</button>
</div>

<button id="pauseBtn" aria-label="pause"><i></i><i></i></button>
<button id="muteBtn" aria-label="sound">♪</button>
<div id="tip"></div>

<script>
(() => {
  const canvas=document.getElementById('gameCanvas'), ctx=canvas.getContext('2d');
  const lit=document.createElement('canvas'), lctx=lit.getContext('2d');
  const startOverlay=document.getElementById('startOverlay'),
        resultOverlay=document.getElementById('resultOverlay'),
        resultLabel=document.getElementById('resultLabel'),
        resultTime=document.getElementById('resultTime'),
        hud=document.getElementById('hud'),
        timeVal=document.getElementById('timeVal'),
        bestVal=document.getElementById('bestVal'),
        startBtn=document.getElementById('startBtn'),
        retryBtn=document.getElementById('retryBtn'),
        pauseBtn=document.getElementById('pauseBtn'),
        pauseOverlay=document.getElementById('pauseOverlay'),
        resumeBtn=document.getElementById('resumeBtn'),
        pRetryBtn=document.getElementById('pRetryBtn'),
        tipEl=document.getElementById('tip'),
        resTime=document.getElementById('resTime'),
        resBest=document.getElementById('resBest'),
        muteBtn=document.getElementById('muteBtn');

  // ================= 사운드 =================
  // 원칙: 이 소리를 들으면 플레이어가 무엇을 알아야 하는가?
  //  ① 낮은 웅웅거림 = 시야 밖에 유령이 있다 (좌우로 방향까지)
  //  ② 짧은 경보     = 유령이 방금 나를 발견했다
  //  ③ 맑은 종소리   = Pulse를 쓸 수 있을 만큼 빛이 찼다
  //  ④ 확인음        = 색을 되찾았다 / 빛을 썼다 / 잡혔다
  let AC=null, master=null, muted=false;
  let humOsc=null, humGain=null, humPan=null, humFilt=null, chimeArmed=false;

  function audioInit(){
    if(AC){ if(AC.state==='suspended') AC.resume(); return; }
    try{
      AC=new (window.AudioContext||window.webkitAudioContext)();
      master=AC.createGain(); master.gain.value=0.30; master.connect(AC.destination);
      // ① 상시 웅웅거림 — 유령의 근접과 방향을 소리로 전달
      humOsc=AC.createOscillator(); humOsc.type='sawtooth'; humOsc.frequency.value=58;
      humFilt=AC.createBiquadFilter(); humFilt.type='lowpass'; humFilt.frequency.value=220;
      humGain=AC.createGain(); humGain.gain.value=0.0001;
      humPan = AC.createStereoPanner ? AC.createStereoPanner() : null;
      humOsc.connect(humFilt); humFilt.connect(humGain);
      if(humPan){ humGain.connect(humPan); humPan.connect(master); }
      else humGain.connect(master);
      humOsc.start();
    }catch(e){ AC=null; }
  }
  function tone(freq,dur,type,vol,glideTo,delay){
    if(!AC||muted) return;
    const t0=AC.currentTime+(delay||0);
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(freq,t0);
    if(glideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30,glideTo),t0+dur);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002,vol||0.3),t0+Math.min(0.03,dur*0.2));
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0+dur+0.05);
  }
  function noise(dur,vol,lp){
    if(!AC||muted) return;
    const n=Math.floor(AC.sampleRate*dur);
    const buf=AC.createBuffer(1,n,AC.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    const src=AC.createBufferSource(); src.buffer=buf;
    const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=lp||900;
    const g=AC.createGain(); g.gain.value=vol||0.2;
    src.connect(f); f.connect(g); g.connect(master); src.start();
  }
  // 웅웅거림 갱신 — 가장 가까운 '보이지 않는' 유령의 거리와 방향
  function updateHum(){
    if(!AC||!humGain) return;
    let lvl=0, ang=0;
    if(state==='playing'){
      let best=null;
      for(const g of ghosts){
        if(g.stun>0) continue;
        const w=g.tell||0;
        if(w>lvl){ lvl=w; best=g; }
      }
      if(best) ang=Math.atan2(best.y-player.y, best.x-player.x);
    }
    const target = muted ? 0.0001 : Math.max(0.0001, lvl*lvl*0.16);
    const now=AC.currentTime;
    humGain.gain.setTargetAtTime(target, now, 0.10);
    humFilt.frequency.setTargetAtTime(150+220*lvl, now, 0.15);
    humOsc.frequency.setTargetAtTime(52+26*lvl, now, 0.15);
    if(humPan) humPan.pan.setTargetAtTime(Math.max(-1,Math.min(1,Math.cos(ang)*1.1)), now, 0.12);
  }
  const SFX={
    spotted(){ tone(560,0.16,'square',0.16,420); tone(380,0.22,'square',0.10,300,0.08); }, // ② 발견당함
    ready(){ tone(1320,0.30,'sine',0.16); tone(1760,0.26,'sine',0.07,null,0.05); },        // ③ Pulse 준비됨
    pick(){ tone(660,0.34,'sine',0.26); tone(990,0.30,'sine',0.10,null,0.05); },           // ④ 색 회복
    pulse(p){ tone(220+180*p,0.30,'triangle',0.26,70); noise(0.26,0.12+0.08*p,1500); },    // ④ 빛 사용
    die(){ tone(300,0.85,'sine',0.30,60); noise(0.45,0.18,600); },                          // ④ 잡힘
    clear(){ tone(523,1.2,'sine',0.20); tone(784,1.2,'sine',0.12,null,0.10); }
  };

  let DPR=Math.min(window.devicePixelRatio||1,2.5), W=0,H=0;
  function resize(){
    W=window.innerWidth; H=window.innerHeight;
    canvas.width=W*DPR; canvas.height=H*DPR;
    lit.width=W*DPR; lit.height=H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    lctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize',resize); resize();

  const PLAYER_SPEED=235, PLAYER_R=9;
  const GHOST_SPEED=82, GHOST_R=13;          // 기준 속도
  const SPD_CHASE=1.18;                      // 나를 발견한 유령 (조금 빠르게)
  const SPD_SEARCH=0.30;                     // 마지막으로 본 곳으로 이동
  const SPD_DRIFT=0.13;                      // 아직 못 본 채 다가옴 (조금 느리게)

  const VISION_START=186, VISION_MIN=132, VISION_DECAY_T=60;
  const MOVE_PENALTY_MAX=72, PENALTY_RATE=44;
  const RECOVER_RATE=110;
  const STOP_BONUS_MAX=118, STOP_BONUS_RATE=92;
  // ---- B: 몸에 담긴 빛 ----
  const LIGHT_VIS_MAX=210;      // 7색 전부 담았을 때 늘어나는 시야
  // 시야 배율에 따른 유령의 3단계 상태
  const DETECT_MUL=1.15, DETECT_ADD=30;   // ① 이 안에 들면 추적 (내 시야보다 조금 넓게)
  const ALERT_MUL=1.95;                   // ② 이 안이면 아주 느리게 다가옴
  const DRIFT_MUL=0.20;                   //    그때의 속도 배율
                                          // ③ 그 밖이면 제자리에 머문다
  const DRAIN_RECOVER=2.6;      // Pulse 후 시야가 돌아오는 데 걸리는 시간(초)
  const GHOST_IDLE_MUL=0.42;    // 발견 못 했을 때의 배회 속도
  const GHOST_LOSE=2.0;         // 시야 밖으로 나간 뒤 놓치기까지
  const AMBIENT=0.05, FALLOFF_SCALE=1.35;

  // 유령 증가: ① 시간(느리게)  ② 색 획득(크게)
  const SPAWN_START=8.0, SPAWN_MIN=5.0, SPAWN_DECAY_T=60;   // 시간 기반 — 완만하게
  const GHOST_ON_COLOR=3;          // 색 하나를 되찾을 때마다 늘어나는 수
  const GHOST_AT_START=2;          // 시작 시 존재하는 수
  const GHOST_CAP_BASE=11, GHOST_CAP_PER_COLOR=2;   // 동시 상한 (11 → 25)
  const ghostCap = () => GHOST_CAP_BASE + cleared*GHOST_CAP_PER_COLOR;

  const SWITCH_MIN=12.0, SWITCH_MAX=17.0;
  const SCREEN_FLASH_DUR=0.85;

  // ---- 줌아웃 (v7: 대폭 앞당기고 변화량 확대) ----
  // ---- 카메라: 시야와 같은 상태(calm)를 공유 ----
  const ZOOM_RUN=1.15, ZOOM_BASE=1.00, ZOOM_CALM=0.50;   // 정지 시 더 넓게
  const CAM_LERP=5.2;

  // ---- 에너지 / Pulse ----
  const EN_MOVE_RATE=0.045;   // 이동 중 (약 22초)
  const EN_SETTLE_RATE=0.02;  // 멈췄지만 아직 시야 회복 중
  const EN_CALM_RATE=0.26;    // 시야/줌 회복 완료 후 본격 충전 (약 4초)
  const EN_MIN_USE=0.08;
  const PULSE_R_MIN=140, PULSE_R_MAX=470;
  const PULSE_F_MIN=220, PULSE_F_MAX=780;
  const STUN_MIN=0.6,    STUN_MAX=3.0;   // 에너지 비례 마비 시간(초)
  const KNOCK_DECAY=3.4;
  const TAP_MAX_MS=230, TAP_GAP_MS=320, TAP_MOVE=18;

  // ---- 포인트 통과 연출 (일시 정지 + 전체 맵 공개) ----
  const INTER_ABSORB=0.50;                       // 색이 플레이어에게 흡수되는 구간
  const INTER_OUT=0.40, INTER_HOLD_T=1.10, INTER_IN=0.40;
  const INTER_TOTAL=INTER_ABSORB+INTER_OUT+INTER_HOLD_T+INTER_IN;
  const CLEAR_HOLD=3.4;                          // 7색 회복 후 세계를 보여주는 시간
  const SLOTS_FLOOR=4, SLOTS_WALL=2;             // 색 하나당 슬롯 수 (희소하게)

  const INTRO_HOLD=3.0, INTRO_ZOOM_T=0.9;

  const COLS=7, ROWS=9, CELL=210, WALL_T=20, OPEN_EXTRA=0.34;

  // ---- 무지개 7색 ----
  const EXIT_COLORS=[
    {name:'빨강', c:'#ff4d4d', rgb:'255,77,77'},
    {name:'주황', c:'#ff9838', rgb:'255,152,56'},
    {name:'노랑', c:'#ffe14d', rgb:'255,225,77'},
    {name:'초록', c:'#5ce87f', rgb:'92,232,127'},
    {name:'파랑', c:'#4dabff', rgb:'77,171,255'},
    {name:'남색', c:'#5566f0', rgb:'85,102,240'},
    {name:'보라', c:'#b665ff', rgb:'182,101,255'}
  ];

  let world={w:0,h:0};
  let player, exits, ghosts, elapsed, nextSpawnAt, best=null;
  let state='idle', stateT=0;
  let pointerDown=false, dirX=0, dirY=1;
  let walls=[], openCells=[];
  let energy=0, camScale=1, pulses=[];
  let tapStartT=0, tapStartX=0, tapStartY=0, tapMoved=0, lastTapT=-1e9, lastTapX=0, lastTapY=0;
  let movePenalty=0, stopBonus=0;
  let targetIdx=0, nextSwitch=0, totalPoints=0, cleared=0;
  let interFromScale=1;
  let recovered=[], slots=[], recoverFx=null, clearOrder=[];
  let pulseDrain=0;
  let bounds={x0:0,y0:0,x1:0,y1:0}, boundsT={x0:0,y0:0,x1:0,y1:0};
  let pointOrder=[], lastPointX, lastPointY;
  let interApplied=false;
  let vWall=[], hWall=[];
  // ---- STEP5: 흐름 상태 ----
  // 인트로 단계: 어둠+주인공 → 전체 맵 → 주인공 위치 복귀 → 문장 → 찾을 색 깜빡임
  const AW_FULL ={char:1.15, out:0.85, map:1.30, in:0.85, text:1.05, blink:1.35};
  const AW_QUICK={char:0.25, out:0.45, map:0.70, in:0.45, text:0.00, blink:0.55};
  let AW=AW_FULL, AWAKEN_T=0, introSeen=false;
  function setIntroMode(full){
    AW = full ? AW_FULL : AW_QUICK;
    AWAKEN_T = AW.char+AW.out+AW.map+AW.in+AW.text+AW.blink;
  }
  setIntroMode(true);
  const GAMEOVER_T=1.5, ENDING_T=8.2;
  let prevState='playing', goFx=null, endingT=0;
  // 상황 기반 안내 — 현상이 먼저 일어나고, 그것을 짧게 설명한다
  const seenTip={};
  let tipTimer=0, movedT=0, stoppedT=0, ghostSeenT=0, bodyEmpty=0, beaconT=0;
  // 첫 위기에서 Pulse를 직접 발견하게 만드는 안내
  let pulsePrompt=0, pulsePromptPh=0, pulseTaught=false;
  const PULSE_TEACH_ENERGY=0.62;   // 첫 위기 때 최소한 쓸 수 있을 만큼은 채워준다
  const TIP_DUR=2.8;
  function tip(key,text){
    if(seenTip[key]) return;
    seenTip[key]=true;
    tipEl.innerHTML=text.replace(/\n/g,'<br>');
    tipEl.classList.add('on'); tipTimer=TIP_DUR;
  }
  const fmtTime=(t)=>{
    const m=Math.floor(t/60), sec=t-m*60;
    return (m<10?'0':'')+m+':'+(sec<10?'0':'')+sec.toFixed(1);
  };
  // 시야 밖 유령 접근에 대한 아주 약한 신호
  const DANGER_NEAR=90;      // 이보다 가까우면 신호 최대
  const DANGER_FAR_MUL=2.1;  // 시야의 이 배율 밖은 신호 없음
  const TELL_MAX_A=0.80;     // 기척 신호 밝기 상한

  // ---- 진행에 따른 플레이 영역 축소 (index = 획득한 포인트 수) ----
  const MAP_SCALE_BY_PROGRESS=[1.00, 0.94, 0.88, 0.82, 0.76, 0.70, 0.64, 0.60];
  const BOUND_LERP=1.6;      // 경계가 좁혀지는 속도
  const BOUND_MARGIN=26;     // 경계 안쪽 여유
  let screenFlash=null, fizzles=[];

  function buildMaze(){
    world.w=COLS*CELL; world.h=ROWS*CELL;
    const vW=[], hW=[], vis=[];   // 지역 작업용
    for(let i=0;i<COLS;i++){ vW[i]=[]; hW[i]=[]; vis[i]=[];
      for(let j=0;j<ROWS;j++){ vW[i][j]=true; hW[i][j]=true; vis[i][j]=false; } }
    const st=[[Math.floor(COLS/2), ROWS-1]];
    vis[st[0][0]][st[0][1]]=true;
    while(st.length){
      const [ci,cj]=st[st.length-1], nb=[];
      if(ci>0      && !vis[ci-1][cj]) nb.push([ci-1,cj,'v',ci-1,cj]);
      if(ci<COLS-1 && !vis[ci+1][cj]) nb.push([ci+1,cj,'v',ci,cj]);
      if(cj>0      && !vis[ci][cj-1]) nb.push([ci,cj-1,'h',ci,cj-1]);
      if(cj<ROWS-1 && !vis[ci][cj+1]) nb.push([ci,cj+1,'h',ci,cj]);
      if(!nb.length){ st.pop(); continue; }
      const p=nb[Math.floor(Math.random()*nb.length)];
      if(p[2]==='v') vW[p[3]][p[4]]=false; else hW[p[3]][p[4]]=false;
      vis[p[0]][p[1]]=true; st.push([p[0],p[1]]);
    }
    for(let i=0;i<COLS-1;i++) for(let j=0;j<ROWS;j++)
      if(vW[i][j] && Math.random()<OPEN_EXTRA) vW[i][j]=false;
    for(let i=0;i<COLS;i++) for(let j=0;j<ROWS-1;j++)
      if(hW[i][j] && Math.random()<OPEN_EXTRA) hW[i][j]=false;

    vWall=vW; hWall=hW;
    rebuildWalls();

    openCells=[];
    for(let i=0;i<COLS;i++) for(let j=0;j<ROWS;j++)
      openCells.push({i:i, j:j, x:i*CELL+CELL/2, y:j*CELL+CELL/2});
  }

  function rebuildWalls(){
    walls=[];
    for(let i=0;i<COLS-1;i++) for(let j=0;j<ROWS;j++)
      if(vWall[i][j]) walls.push({x:(i+1)*CELL-WALL_T/2, y:j*CELL, w:WALL_T, h:CELL});
    for(let i=0;i<COLS;i++) for(let j=0;j<ROWS-1;j++)
      if(hWall[i][j]) walls.push({x:i*CELL, y:(j+1)*CELL-WALL_T/2, w:CELL, h:WALL_T});
  }

  // ---- 축소된 영역 안에서 실제로 다닐 수 있는 셀 계산 ----
  function cellUsable(i,j){
    // 셀 중심이 경계 안쪽에 충분히 들어와야 통행 가능한 칸으로 본다
    const cx=i*CELL+CELL/2, cy=j*CELL+CELL/2, m=CELL*0.18;
    return cx-m>bounds.x0 && cx+m<bounds.x1 && cy-m>bounds.y0 && cy+m<bounds.y1;
  }
  function passable(i,j,ni,nj){
    if(ni===i+1) return !vWall[i][j];
    if(ni===i-1) return !vWall[i-1][j];
    if(nj===j+1) return !hWall[i][j];
    if(nj===j-1) return !hWall[i][j-1];
    return false;
  }
  function reachableFrom(si,sj){
    const seen=new Set();
    if(!cellUsable(si,sj)){          // 경계에 걸린 칸이면 가장 가까운 유효 칸에서 시작
      let bi=-1,bj=-1,bd=1e9;
      for(let i=0;i<COLS;i++) for(let j=0;j<ROWS;j++){
        if(!cellUsable(i,j)) continue;
        const d=Math.abs(i-si)+Math.abs(j-sj);
        if(d<bd){ bd=d; bi=i; bj=j; }
      }
      if(bi<0) return seen;
      si=bi; sj=bj;
    }
    const q=[[si,sj]];
    seen.add(si+','+sj);
    while(q.length){
      const [i,j]=q.shift();
      for(const [ni,nj] of [[i+1,j],[i-1,j],[i,j+1],[i,j-1]]){
        if(ni<0||nj<0||ni>=COLS||nj>=ROWS) continue;
        const key=ni+','+nj;
        if(seen.has(key)) continue;
        if(!cellUsable(ni,nj)) continue;
        if(!passable(i,j,ni,nj)) continue;
        seen.add(key); q.push([ni,nj]);
      }
    }
    return seen;
  }
  // 축소 때문에 끊긴 구간이 생겼을 때만 벽을 최소한으로 연다
  function fixConnectivity(){
    const pi=Math.max(0,Math.min(COLS-1,Math.floor(player.x/CELL)));
    const pj=Math.max(0,Math.min(ROWS-1,Math.floor(player.y/CELL)));
    let opened=0;
    for(let pass=0; pass<6; pass++){
      const seen=reachableFrom(pi,pj);
      const usable=[];
      for(let i=0;i<COLS;i++) for(let j=0;j<ROWS;j++) if(cellUsable(i,j)) usable.push([i,j]);
      const missing=usable.filter(([i,j])=>!seen.has(i+','+j));
      if(!missing.length) break;
      let changed=false;
      for(const [i,j] of missing){
        for(const [ni,nj] of [[i+1,j],[i-1,j],[i,j+1],[i,j-1]]){
          if(ni<0||nj<0||ni>=COLS||nj>=ROWS) continue;
          if(!seen.has(ni+','+nj)) continue;
          // 이 벽 하나만 연다
          if(ni===i+1) vWall[i][j]=false;
          else if(ni===i-1) vWall[i-1][j]=false;
          else if(nj===j+1) hWall[i][j]=false;
          else hWall[i][j-1]=false;
          opened++; changed=true; break;
        }
        if(changed) break;
      }
      if(!changed) break;
    }
    if(opened) rebuildWalls();
    return opened;
  }
  function reachableCells(){
    const pi=Math.max(0,Math.min(COLS-1,Math.floor(player.x/CELL)));
    const pj=Math.max(0,Math.min(ROWS-1,Math.floor(player.y/CELL)));
    const seen=reachableFrom(pi,pj);
    return openCells.filter(c=>seen.has(c.i+','+c.j));
  }

  function setupWorld(){
    buildMaze();
    player={x:Math.floor(COLS/2)*CELL+CELL/2, y:(ROWS-1)*CELL+CELL/2};

    // 포인트 7개를 한 번에 배치, 그중 하나만 진짜 (기존 구조)
    totalPoints=EXIT_COLORS.length; cleared=0;
    bounds=boundsFor(0); boundsT=boundsFor(0);
    const n=EXIT_COLORS.length;
    const cells=placePoints(n);
    const order=EXIT_COLORS.map((_,i)=>i).sort(()=>Math.random()-0.5);
    exits=[];
    for(let k=0;k<n;k++)
      exits.push({x:cells[k].x, y:cells[k].y, color:EXIT_COLORS[order[k]], ci:order[k], shard:Math.random()*6.3});
    targetIdx=Math.floor(Math.random()*exits.length);
    nextSwitch=SWITCH_MIN+Math.random()*(SWITCH_MAX-SWITCH_MIN);
    for(let k=0;k<GHOST_AT_START;k++) spawnGhost(true);
    recovered=EXIT_COLORS.map(()=>false);
    clearOrder=[];
    recoverFx=null;
    buildSlots();
    targetIdx=Math.floor(Math.random()*exits.length);
    nextSwitch=SWITCH_MIN+Math.random()*(SWITCH_MAX-SWITCH_MIN);

    ghosts=[]; elapsed=0; nextSpawnAt=SPAWN_START*0.6;
    movePenalty=0; stopBonus=0; screenFlash=null; fizzles=[];
    pointerDown=false; moving=false;
    energy=0; camScale=ZOOM_BASE; pulses=[]; lastTapT=-1e9; pulseDrain=0;
  }

  // 색 슬롯: 세계 곳곳에 '꺼져 있는' 문양/균열. 회복하면 그 자리에 불이 들어온다.
  // 매우 희소하게 배치해서 7색을 다 회복해도 무지개 맵이 되지 않게 한다.
  function buildSlots(){
    slots=[];
    for(let ci=0; ci<EXIT_COLORS.length; ci++){
      for(let k=0;k<SLOTS_FLOOR;k++){
        const c=openCells[Math.floor(Math.random()*openCells.length)];
        slots.push({
          type:'floor', ci:ci,
          x:c.x+(Math.random()-0.5)*CELL*0.5,
          y:c.y+(Math.random()-0.5)*CELL*0.5,
          r:9+Math.random()*7,
          rot:Math.random()*Math.PI
        });
      }
      for(let k=0;k<SLOTS_WALL;k++){
        if(!walls.length) break;
        const wl=walls[Math.floor(Math.random()*walls.length)];
        const vertical = wl.h>wl.w;
        const len=(vertical?wl.h:wl.w)*(0.25+Math.random()*0.35);
        const t=Math.random()*((vertical?wl.h:wl.w)-len);
        slots.push({
          type:'wall', ci:ci,
          x: vertical ? wl.x+wl.w/2 : wl.x+t,
          y: vertical ? wl.y+t : wl.y+wl.h/2,
          len:len, vertical:vertical
        });
      }
    }
  }

  // 포인트를 플레이어 기준 서로 다른 방향(섹터)으로 흩뿌린다.
  // 한 방향으로만 달리면 끝나는 배치를 막기 위함.
  function stepBounds(dt){
    const k=Math.min(1, BOUND_LERP*dt);
    bounds.x0+=(boundsT.x0-bounds.x0)*k; bounds.y0+=(boundsT.y0-bounds.y0)*k;
    bounds.x1+=(boundsT.x1-bounds.x1)*k; bounds.y1+=(boundsT.y1-bounds.y1)*k;
    confine(player, PLAYER_R+2);
    for(const g of ghosts) confine(g, GHOST_R);
  }
  function boundsFor(progress){
    const k=MAP_SCALE_BY_PROGRESS[Math.min(progress, MAP_SCALE_BY_PROGRESS.length-1)];
    const cx=world.w/2, cy=world.h/2;
    const hw=world.w*k/2, hh=world.h*k/2;
    return {x0:cx-hw, y0:cy-hh, x1:cx+hw, y1:cy+hh};
  }
  function inBounds(x,y,r){
    return x-r>bounds.x0 && x+r<bounds.x1 && y-r>bounds.y0 && y+r<bounds.y1;
  }
  // 현재 플레이 영역 안의 통로 셀
  function cellsInBounds(pad){
    pad=pad||0;
    return openCells.filter(c=> c.x>bounds.x0+pad && c.x<bounds.x1-pad
                             && c.y>bounds.y0+pad && c.y<bounds.y1-pad);
  }
  // 다음 포인트 위치 — 영역 안 / 벽 아님 / 플레이어와 멀리 / 직전 위치와 다른 방향
  function pickNextPointCell(lastX,lastY){
    const list=cellsInBounds(CELL*0.35);
    if(!list.length) return {x:(bounds.x0+bounds.x1)/2, y:(bounds.y0+bounds.y1)/2};
    const span=Math.min(bounds.x1-bounds.x0, bounds.y1-bounds.y0);
    const minD=Math.max(CELL*2.0, span*0.42);
    let best=null, bs=-1;
    for(const c of list){
      if(inWall(c.x,c.y,26)) continue;
      const dp=Math.hypot(c.x-player.x, c.y-player.y);
      if(dp<minD) continue;
      let sc=Math.min(dp, span)*0.8 + Math.random()*140;
      if(lastX!==undefined){
        const dl=Math.hypot(c.x-lastX,c.y-lastY);
        if(dl<minD*0.8) continue;
        // 직전 포인트와 반대 방향일수록 가점
        const a1=Math.atan2(lastY-player.y, lastX-player.x);
        const a2=Math.atan2(c.y-player.y, c.x-player.x);
        let da=Math.abs(a1-a2); if(da>Math.PI) da=Math.PI*2-da;
        sc += da*90;
      }
      if(sc>bs){ bs=sc; best=c; }
    }
    if(!best){                     // 조건이 너무 빡세면 단계적으로 완화
      for(const c of list){
        if(inWall(c.x,c.y,26)) continue;
        const dp=Math.hypot(c.x-player.x, c.y-player.y);
        if(dp>bs){ bs=dp; best=c; }
      }
    }
    return best||list[0];
  }
  // 아직 되찾지 못한 색을 남은 포인트에 무작위로 다시 배정한다
  function reassignColors(){
    const pool=[];
    for(let i=0;i<EXIT_COLORS.length;i++) if(!recovered[i]) pool.push(i);
    for(let i=pool.length-1;i>0;i--){                 // 셔플
      const j=Math.floor(Math.random()*(i+1));
      [pool[i],pool[j]]=[pool[j],pool[i]];
    }
    for(let k=0;k<exits.length;k++){
      const ci=pool[k % pool.length];
      exits[k].ci=ci;
      exits[k].color=EXIT_COLORS[ci];
    }
  }

  // 남은 포인트들을 현재 플레이 영역 안에서 다시 배치한다 (새 포인트를 추가하지 않는다)
  function repositionPoints(){
    const cells=reachableCells().filter(c=>!inWall(c.x,c.y,28));
    if(!cells.length) return;
    const span=Math.min(bounds.x1-bounds.x0, bounds.y1-bounds.y0);
    const minFromPlayer=Math.min(span*0.40, CELL*2.4);
    const minApart=Math.max(CELL*1.3, span*0.22);
    const used=[];
    for(const ex of exits){
      // 조건을 이미 만족하는 자리면 굳이 옮기지 않는다
      const okHere = inBounds(ex.x,ex.y,26)
        && cells.some(c=>Math.hypot(c.x-ex.x,c.y-ex.y)<4)
        && Math.hypot(ex.x-player.x,ex.y-player.y)>=minFromPlayer
        && used.every(u=>Math.hypot(u.x-ex.x,u.y-ex.y)>=minApart);
      if(okHere){ used.push({x:ex.x,y:ex.y}); continue; }
      let best=null,bs=-1;
      for(const c of cells){
        const dp=Math.hypot(c.x-player.x,c.y-player.y);
        if(dp<minFromPlayer) continue;
        let near=1e9;
        for(const u of used) near=Math.min(near,Math.hypot(c.x-u.x,c.y-u.y));
        if(near<minApart) continue;
        const sc=Math.min(dp,span)*0.7+Math.min(near,span)*0.5+Math.random()*120;
        if(sc>bs){ bs=sc; best=c; }
      }
      if(!best){   // 조건 완화
        for(const c of cells){
          let near=1e9;
          for(const u of used) near=Math.min(near,Math.hypot(c.x-u.x,c.y-u.y));
          if(near>bs){ bs=near; best=c; }
        }
      }
      if(best){ ex.x=best.x; ex.y=best.y; used.push({x:best.x,y:best.y}); }
      else { used.push({x:ex.x,y:ex.y}); }
    }
  }

  function placePoints(n){
    const used=[], out=[];
    const base=Math.random()*Math.PI*2;
    for(let k=0;k<n;k++){
      const a0=base+(k/n)*Math.PI*2, a1=base+((k+1)/n)*Math.PI*2;
      let best=null, bs=-1;
      for(const c of openCells){
        const dx=c.x-player.x, dy=c.y-player.y;
        const d=Math.hypot(dx,dy);
        if(d<CELL*1.7) continue;
        let ang=Math.atan2(dy,dx);
        // 섹터 안인지 판정
        let rel=ang-a0; while(rel<0) rel+=Math.PI*2; while(rel>=Math.PI*2) rel-=Math.PI*2;
        if(rel>(a1-a0)) continue;
        let near=1e9;
        for(const u of used) near=Math.min(near, Math.hypot(c.x-u.x,c.y-u.y));
        if(near<CELL*1.4) continue;
        const score=Math.min(d,1500)*0.6+Math.min(near,900)*0.4+Math.random()*180;
        if(score>bs){ bs=score; best=c; }
      }
      if(!best){ // 섹터에 자리가 없으면 남은 셀 중 가장 흩어진 곳
        for(const c of openCells){
          const d=Math.hypot(c.x-player.x,c.y-player.y);
          if(d<CELL*1.2) continue;
          let near=1e9;
          for(const u of used) near=Math.min(near, Math.hypot(c.x-u.x,c.y-u.y));
          const score=Math.min(near,900)+Math.min(d,1200)*0.3;
          if(score>bs){ bs=score; best=c; }
        }
      }
      if(!best) best=openCells[Math.floor(Math.random()*openCells.length)];
      used.push(best); out.push(best);
    }
    return out;
  }

  // 남아 있는 포인트 중에서만 다음 목표를 고른다 (통과한 것은 제외됨)
  function pickNewTarget(flash){
    if(exits.length===0) return;
    if(exits.length===1){ targetIdx=0; }
    else {
      let n=targetIdx;
      while(n===targetIdx) n=Math.floor(Math.random()*exits.length);
      targetIdx=n;
    }
    if(flash) screenFlash={rgb:exits[targetIdx].color.rgb, t:0};
    nextSwitch=elapsed+SWITCH_MIN+Math.random()*(SWITCH_MAX-SWITCH_MIN);
  }

  function visionCeiling(t){
    const k=Math.min(1,t/VISION_DECAY_T);
    return VISION_START-(VISION_START-VISION_MIN)*(k*k);
  }
  const lightLevel = () => (clearOrder.length)/EXIT_COLORS.length;   // 담긴 빛의 양
  function lightBonus(){ return LIGHT_VIS_MAX*lightLevel() - pulseDrain; }
  function visionRadius(){
    return Math.max(70, visionCeiling(elapsed)-movePenalty+stopBonus+lightBonus());
  }
  function detectRadius(){ return visionRadius()*DETECT_MUL+DETECT_ADD; }
  function spawnInterval(t){
    const k=Math.min(1,t/SPAWN_DECAY_T);
    return SPAWN_START-(SPAWN_START-SPAWN_MIN)*k;
  }
  // 시야와 동일한 상태값: -1(전력 이동) ~ 0(기본) ~ +1(충분히 정지)
  function calmValue(){
    if(movePenalty>0) return -movePenalty/MOVE_PENALTY_MAX;
    return stopBonus/STOP_BONUS_MAX;
  }
  function targetZoom(){
    const c=calmValue();
    return c<0 ? ZOOM_BASE+(ZOOM_RUN-ZOOM_BASE)*(-c)
               : ZOOM_BASE-(ZOOM_BASE-ZOOM_CALM)*c;
  }
  function firePulse(){
    if(energy<EN_MIN_USE) return;
    const e=energy;
    // 위력 = 에너지 × 담긴 빛 (빛이 많을수록 강해짐)
    const p=e*(0.55+0.45*lightLevel());
    const R=PULSE_R_MIN+(PULSE_R_MAX-PULSE_R_MIN)*p;
    const F=PULSE_F_MIN+(PULSE_F_MAX-PULSE_F_MIN)*p;
    for(const g of ghosts){
      const dx=g.x-player.x, dy=g.y-player.y;
      const d=Math.hypot(dx,dy)||1;
      if(d>R) continue;
      const fall=1-(d/R)*0.55;         // 가까울수록 세게
      g.kx=(dx/d)*F*fall; g.ky=(dy/d)*F*fall;
      g.stun=Math.max(g.stun||0, (STUN_MIN+(STUN_MAX-STUN_MIN)*p)*fall);
      g.stunMax=g.stun;
    }
    pulses.push({t:0, R:R, e:p}); SFX.pulse(p);
    energy=0;
    // 담고 있던 빛을 소비 → 시야가 일시적으로 좁아지고 서서히 회복
    pulseDrain = LIGHT_VIS_MAX*lightLevel()*(0.35+0.35*e);
    seenTip.pulse=true;
    if(!pulseTaught){
      pulseTaught=true; pulsePrompt=0;
      tipEl.innerHTML='빛을 사용했다<br><span style="font-size:12.5px;color:#a9a6b8">시야가 잠시 좁아진다</span>';
      tipEl.classList.add('on'); tipTimer=2.6;
    }
  }

  function inWall(x,y,r){
    for(const wl of walls)
      if(x+r>wl.x && x-r<wl.x+wl.w && y+r>wl.y && y-r<wl.y+wl.h) return true;
    return false;
  }
  function moveWithCollision(o,vx,vy,r){
    const nx=o.x+vx;
    if(!inWall(nx,o.y,r) && nx-r>bounds.x0 && nx+r<bounds.x1) o.x=nx;
    const ny=o.y+vy;
    if(!inWall(o.x,ny,r) && ny-r>bounds.y0 && ny+r<bounds.y1) o.y=ny;
  }
  // 경계가 좁혀지면 안으로 밀어 넣는다
  function confine(o,r){
    o.x=Math.max(bounds.x0+r, Math.min(bounds.x1-r, o.x));
    o.y=Math.max(bounds.y0+r, Math.min(bounds.y1-r, o.y));
  }

  function spawnGhost(far){
    const vr=visionRadius();
    for(let i=0;i<20;i++){
      const a=Math.random()*Math.PI*2, d=vr*(far?1.5:1.1)+90+Math.random()*200;
      const cx=player.x+Math.cos(a)*d, cy=player.y+Math.sin(a)*d;
      if(inBounds(cx,cy,24)){ ghosts.push({x:cx,y:cy,ph:Math.random()*6.3,kx:0,ky:0,stun:0,stunMax:0,jit:0,seen:0,tell:0,tellPh:Math.random()*6.3,tellJit:Math.random()*6.3,lx:undefined,ly:undefined,ci:Math.floor(Math.random()*EXIT_COLORS.length)}); return; }
    }
  }

  // 상대 드래그: 손가락을 처음 댄 지점이 기준점, 그 지점에서 움직인 방향으로 이동
  const DEAD_ZONE=14;      // 이 거리 미만은 정지
  const MAX_OFFSET=78;     // 기준점이 손가락을 따라오기 시작하는 거리
  let originX=0, originY=0, moving=false;

  function updateDir(px,py){
    let dx=px-originX, dy=py-originY;
    let len=Math.hypot(dx,dy);
    if(len>MAX_OFFSET){                 // 기준점을 손가락 쪽으로 끌어당김 (플로팅 스틱)
      const k=(len-MAX_OFFSET)/len;
      originX+=dx*k; originY+=dy*k;
      dx=px-originX; dy=py-originY; len=Math.hypot(dx,dy);
    }
    if(len<DEAD_ZONE){ moving=false; return; }
    moving=true; dirX=dx/len; dirY=dy/len;
  }
  canvas.addEventListener('pointerdown',e=>{
    e.preventDefault();
    try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
    audioInit();
    pointerDown=true; moving=false;
    originX=e.clientX; originY=e.clientY;
    tapStartT=performance.now(); tapStartX=e.clientX; tapStartY=e.clientY; tapMoved=0;
  },{passive:false});
  function onMove(e){
    if(!pointerDown) return;
    if(e.cancelable) e.preventDefault();
    tapMoved=Math.max(tapMoved, Math.hypot(e.clientX-tapStartX, e.clientY-tapStartY));
    updateDir(e.clientX,e.clientY);
  }
  canvas.addEventListener('pointermove',onMove,{passive:false});
  window.addEventListener('pointermove',onMove,{passive:false});
  function endPointer(e){
    if(!pointerDown) return;
    pointerDown=false; moving=false;
    if(state!=='playing') return;
    const now=performance.now();
    const isTap = (now-tapStartT)<TAP_MAX_MS && tapMoved<TAP_MOVE;
    if(!isTap){ lastTapT=-1e9; return; }
    if(now-lastTapT<TAP_GAP_MS && Math.hypot(tapStartX-lastTapX, tapStartY-lastTapY)<50){
      firePulse();
      lastTapT=-1e9;
    } else {
      lastTapT=now; lastTapX=tapStartX; lastTapY=tapStartY;
    }
  }
  window.addEventListener('pointerup',endPointer);
  window.addEventListener('pointerleave',()=>{ /* 화면 밖으로 나가도 캡처로 유지된다 */ });
  window.addEventListener('blur',()=>{ pointerDown=false; moving=false; });
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){ pointerDown=false; moving=false; lastTime=null;
      if(state==='playing'||state==='interlude') pauseGame(); }
  });
  window.addEventListener('pointercancel',()=>{pointerDown=false; moving=false;});
  // 브라우저 스크롤 / 당겨서 새로고침 / 오버스크롤 차단
  // 버튼 등 UI 요소의 탭은 막지 않는다
  const isUI = t => t && t.closest && t.closest('button, .overlay');
  for(const ev of ['touchstart','touchmove','touchend'])
    document.addEventListener(ev, e=>{
      if(isUI(e.target)) return;
      if(e.cancelable) e.preventDefault();
    }, {passive:false});
  document.addEventListener('gesturestart',e=>e.preventDefault());
  document.addEventListener('gesturechange',e=>e.preventDefault());
  document.addEventListener('gestureend',e=>e.preventDefault());
  document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
  // iOS: 300ms 안의 두 번째 탭은 확대 제스처로 해석되므로 기본 동작을 막는다
  let __lastTouchEnd=0;
  document.addEventListener('touchend',e=>{
    const now=Date.now();
    if(now-__lastTouchEnd<=350 && e.cancelable) e.preventDefault();
    __lastTouchEnd=now;
  },{passive:false});
  document.addEventListener('contextmenu',e=>e.preventDefault());
  window.addEventListener('scroll',()=>window.scrollTo(0,0),{passive:true});

  function beginGame(){
    setupWorld();
    startOverlay.classList.add('hidden');
    resultOverlay.classList.add('hidden');
    pauseOverlay.classList.add('hidden');
    setIntroMode(!introSeen); introSeen=true;
    state='awaken'; stateT=0; goFx=null; endingT=0;
    hud.classList.remove('visible');
    pauseBtn.classList.remove('on'); muteBtn.classList.remove('on');
    tipTimer=0; movedT=0; stoppedT=0; ghostSeenT=0; bodyEmpty=0; beaconT=0;
    pulsePrompt=0; pulsePromptPh=0;
    hideTip();
  }
  function hideTip(){ tipEl.classList.remove('on'); }

  // ---- 일시정지 ----
  function pauseGame(){
    if(state!=='playing' && state!=='interlude') return;
    prevState=state; state='paused';
    pauseOverlay.classList.remove('hidden');
    pauseBtn.classList.remove('on'); muteBtn.classList.remove('on');
    pointerDown=false; moving=false;
  }
  function resumeGame(){
    if(state!=='paused') return;
    state=prevState;
    pauseOverlay.classList.add('hidden');
    pauseBtn.classList.add('on'); muteBtn.classList.add('on');
  }
  muteBtn.addEventListener('click', ()=>{
    audioInit(); muted=!muted;
    muteBtn.classList.toggle('off', muted);
    muteBtn.textContent = muted ? '✕' : '♪';
  });
  pauseBtn.addEventListener('click', pauseGame);
  resumeBtn.addEventListener('click', resumeGame);
  pRetryBtn.addEventListener('click', beginGame);
  startBtn.addEventListener('click',()=>{ audioInit(); beginGame(); });
  retryBtn.addEventListener('click',beginGame);

  // 유령에게 잡힘 → 짧은 연출 후 결과
  function loseGame(g){
    if(state==='gameover'||state==='result') return;
    state='gameover'; stateT=0;
    goFx={x:g?g.x:player.x, y:g?g.y:player.y}; SFX.die();
    pointerDown=false; moving=false;
    pauseBtn.classList.remove('on'); muteBtn.classList.remove('on');
    hideTip();
  }
  function showResult(won){
    state='result'; stateT=0;
    const t=elapsed;
    if(won && (best===null||t<best)) best=t;
    resultLabel.textContent = won?'CLEAR':'GAME OVER';
    resultLabel.className='resultLabel '+(won?'success':'fail');
    resTime.textContent=fmtTime(t);
    resBest.textContent = best===null ? '--:--' : fmtTime(best);
    document.getElementById('resultStat').innerHTML =
      won ? '되찾은 빛 &nbsp;<b>7 / 7</b>'
          : '되찾은 빛 &nbsp;<b>'+cleared+' / '+totalPoints+'</b>';
    bestVal.textContent = best===null ? '–' : fmtTime(best);
    resultOverlay.classList.remove('hidden');
    hud.classList.remove('visible');
    pauseBtn.classList.remove('on'); muteBtn.classList.remove('on');
    hideTip();
  }
  function endGame(won){ won ? showResult(true) : loseGame(null); }

  function update(dt){
    stateT+=dt;
    if(state==='paused') return;
    if(state==='awaken'){
      if(stateT>=AWAKEN_T){
        state='playing'; stateT=0; beaconT=9.0;
        hud.classList.add('visible'); pauseBtn.classList.add('on'); muteBtn.classList.add('on');
        if(exits.length) screenFlash={rgb:exits[targetIdx].color.rgb, t:0};
      }
      return;
    }
    if(state==='gameover'){
      if(stateT>=GAMEOVER_T) showResult(false);
      return;
    }
    if(state==='ending'){
      endingT+=dt;
      // 되돌려준 색만큼 세계가 다시 넓어진다
      const k=Math.min(1, 0.9*dt);
      bounds.x0+=(boundsT.x0-bounds.x0)*k; bounds.y0+=(boundsT.y0-bounds.y0)*k;
      bounds.x1+=(boundsT.x1-bounds.x1)*k; bounds.y1+=(boundsT.y1-bounds.y1)*k;
      if(stateT>=ENDING_T) showResult(true);
      return;
    }
    if(state==='intro'){ if(stateT>=INTRO_HOLD){state='transition'; stateT=0;} return; }
    if(state==='interlude'){
      // 유령/스폰/시야/에너지/시간 모두 정지. 연출만 진행.
      for(const p of pulses) p.t+=dt;
      pulses=pulses.filter(p=>p.t<0.75);
      if(recoverFx) recoverFx.t+=dt;
      stepBounds(dt);

      // ★ 줌아웃으로 보여주기 "전에" 축소와 재배치를 끝낸다
      if(!interApplied && stateT>=INTER_ABSORB){
        interApplied=true;
        bounds={x0:boundsT.x0,y0:boundsT.y0,x1:boundsT.x1,y1:boundsT.y1};
        confine(player, PLAYER_R+2);
        for(const g of ghosts) confine(g, GHOST_R);
        fixConnectivity();     // 끊긴 통로가 생겼을 때만 벽을 최소 수정
        repositionPoints();    // 남은 포인트를 좁아진 영역 안에서 재배치
        reassignColors();      // 남은 포인트의 색도 매번 새로 섞는다
        pickNewTarget(false);  // 새 목표를 미리 정한다 (색은 재개 순간에 알려줌)
        for(let k=0;k<GHOST_ON_COLOR;k++)          // 색 하나당 유령 증가
          if(ghosts.length<ghostCap()) spawnGhost(true);
      }

      if(stateT>=INTER_TOTAL){
        state='playing'; stateT=0; recoverFx=null;
        if(exits.length) screenFlash={rgb:exits[targetIdx].color.rgb, t:0};
        if(cleared===1) tip('light','색을 담을수록 더 멀리 볼 수 있다');
      }
      return;
    }
    if(state==='clearing'){
      if(recoverFx) recoverFx.t+=dt;
      if(stateT>=CLEAR_HOLD){
        recoverFx=null; state='ending'; stateT=0; endingT=0; 
        boundsT=boundsFor(0);          // 세계가 원래 크기로 되돌아간다
      }
      return;
    }
    if(state==='transition'){
      if(stateT>=INTRO_ZOOM_T){
        state='playing'; stateT=0; hud.classList.add('visible'); pauseBtn.classList.add('on'); muteBtn.classList.add('on');
        if(exits.length) screenFlash={rgb:exits[targetIdx].color.rgb, t:0};
      }
      return;
    }
    if(state!=='playing') return;

    elapsed+=dt;
    timeVal.textContent=elapsed.toFixed(1)+'s';

    if(moving){
      moveWithCollision(player, dirX*PLAYER_SPEED*dt, dirY*PLAYER_SPEED*dt, PLAYER_R);
      movePenalty=Math.min(MOVE_PENALTY_MAX, movePenalty+PENALTY_RATE*dt);
      stopBonus=Math.max(0, stopBonus-STOP_BONUS_RATE*2.2*dt);
      energy=Math.min(1, energy+EN_MOVE_RATE*dt);
    } else {
      if(movePenalty>0){
        movePenalty=Math.max(0, movePenalty-RECOVER_RATE*dt);
        energy=Math.min(1, energy+EN_SETTLE_RATE*dt);
      } else {
        stopBonus=Math.min(STOP_BONUS_MAX, stopBonus+STOP_BONUS_RATE*dt);
        energy=Math.min(1, energy+EN_CALM_RATE*dt);
      }
    }

    // ---- 상황 기반 안내 ----
    if(tipTimer>0){ tipTimer-=dt; if(tipTimer<=0) hideTip(); }
    pulsePromptPh+=dt*2.4;
    if(beaconT>0) beaconT-=dt;
    if(moving){ movedT+=dt; stoppedT=0; } else stoppedT+=dt;
    if(movedT>1.1) tip('move','움직이면 시야가 좁아진다');
    if(seenTip.move && movedT>1.1 && stoppedT>1.0) tip('stop','멈추면 다시 볼 수 있다');
    {
      let chased=false, near=1e9;
      for(const g of ghosts){
        if(g.seen>0) chased=true;
        near=Math.min(near, Math.hypot(player.x-g.x, player.y-g.y));
      }
      // 색을 담은 뒤 발견당하면 그 인과를 알려준다
      if(cleared>0 && chased){ ghostSeenT+=dt; if(ghostSeenT>0.4) tip('ghost','밝아질수록 유령에게 더 쉽게 발견된다'); }
      else if(!chased) ghostSeenT=0;
      // 유령이 실제로 나를 쫓아 가까이 붙은 첫 순간 → 색과 무관하게 조작을 알려준다
      if(!pulseTaught && chased && near<visionRadius()*1.05){
        if(energy<PULSE_TEACH_ENERGY) energy=PULSE_TEACH_ENERGY;  // 쓸 수 있게 보장
        pulsePrompt=Math.min(1, pulsePrompt+dt*3.2);
        if(!seenTip.pulse){
          seenTip.pulse=true;
          tipEl.innerHTML='두 번 탭 &nbsp;→&nbsp; PULSE<br><span style="font-size:12.5px;color:#a9a6b8">빛을 써서 유령을 밀어낸다</span>';
          tipEl.classList.add('on'); tipTimer=99;      // 실제로 쓸 때까지 남겨둔다
        }
      } else if(!pulseTaught){
        pulsePrompt=Math.max(0, pulsePrompt-dt*2.0);
      }
    }

    // 플레이어 애니메이션 값
    pBreath += dt*(moving?5.5:2.0);
    pStretch += ((moving?1:0)-pStretch)*Math.min(1, 9*dt);
    if(moving){
      const k=Math.min(1, 9*dt);
      pfx += (dirX-pfx)*k; pfy += (dirY-pfy)*k;
    }

    if(pulseDrain>0) pulseDrain=Math.max(0, pulseDrain - (LIGHT_VIS_MAX/DRAIN_RECOVER)*dt);
    if(energy>=0.999){ if(!chimeArmed){ chimeArmed=true; SFX.ready(); } } else if(energy<0.6) chimeArmed=false;
    stepBounds(dt);

    // 시야 밖에서 다가오는 유령의 기척
    {
      // 보이는 원 바깥(=시야 감쇠 끝)부터 기척이 시작된다
      const vr=visionRadius();
      const edge=vr*FALLOFF_SCALE;
      const near=edge*0.92;                    // 보이는 원 바로 바깥부터
      const far =Math.max(edge+150, edge*1.55); // 그 근처까지만
      for(const g of ghosts){
        const d=Math.hypot(player.x-g.x, player.y-g.y);
        let want=0;
        if(g.stun<=0 && d>near && d<far)
          want=Math.max(0,Math.min(1,1-(d-near)/Math.max(1,far-near)));
        const prevTell=g.tell||0;
        g.tell = prevTell + (want-prevTell)*Math.min(1, 3.2*dt);

        if(g.tellPh===undefined) g.tellPh=Math.random()*6.3;
        g.tellPh += dt*(0.9+1.7*g.tell);
        // 방향은 대략만 — 천천히 흔들리는 오차를 준다
        if(g.tellJit===undefined) g.tellJit=Math.random()*6.3;
        g.tellJit += dt*0.8;
      }
    }

    // 카메라: 시야와 같은 상태값을 부드럽게 따라감
    camScale += (targetZoom()-camScale)*Math.min(1, CAM_LERP*dt);

    for(const p of pulses) p.t+=dt;
    pulses=pulses.filter(p=>p.t<0.75);

    if(elapsed>=nextSwitch && exits.length>1) pickNewTarget(true);
    if(screenFlash){ screenFlash.t+=dt; if(screenFlash.t>=SCREEN_FLASH_DUR) screenFlash=null; }
    for(const f of fizzles) f.t+=dt;
    fizzles=fizzles.filter(f=>f.t<0.7);

    if(elapsed>=nextSpawnAt){ if(ghosts.length<ghostCap()) spawnGhost(); nextSpawnAt=elapsed+spawnInterval(elapsed); }

    for(const g of ghosts){
      if(g.stun>0){
        g.stun=Math.max(0,g.stun-dt);
        g.jit=(g.jit||0)+dt*22;
      } else {
        const dx=player.x-g.x, dy=player.y-g.y, len=Math.hypot(dx,dy)||1;
        const vr=visionRadius();
        const chaseR=vr*DETECT_MUL+DETECT_ADD;   // ① 추적 범위
        const alertR=vr*ALERT_MUL;               // ② 접근 범위
        if(len<chaseR){
          if(!(g.seen>0)) SFX.spotted();
          g.seen=GHOST_LOSE; g.lx=player.x; g.ly=player.y;
        } else {
          g.seen=Math.max(0,(g.seen||0)-dt);
        }
        if(g.seen>0){
          // 추적 중 — 정상 속도로 곧장 다가온다
          g.x+=dx/len*GHOST_SPEED*SPD_CHASE*dt; g.y+=dy/len*GHOST_SPEED*SPD_CHASE*dt;
        } else if(len<alertR){
          // 놓쳤지만 아직 근처 — 마지막으로 본 곳으로, 없으면 아주 느리게 접근
          const tx=(g.lx!==undefined?g.lx:player.x), ty=(g.ly!==undefined?g.ly:player.y);
          const td=Math.hypot(tx-g.x,ty-g.y);
          if(td>6){
            g.x+=(tx-g.x)/td*GHOST_SPEED*SPD_SEARCH*dt;
            g.y+=(ty-g.y)/td*GHOST_SPEED*SPD_SEARCH*dt;
          } else {
            g.x+=dx/len*GHOST_SPEED*SPD_DRIFT*dt;
            g.y+=dy/len*GHOST_SPEED*SPD_DRIFT*dt;
          }
        }
        // ③ alertR 밖이면 움직이지 않는다 (제자리에서 떠 있음)
        g.ph+=dt*2.2;
      }
      if(g.kx||g.ky){
        g.x+=g.kx*dt; g.y+=g.ky*dt;
        const d=Math.exp(-KNOCK_DECAY*dt);
        g.kx*=d; g.ky*=d;
        if(Math.abs(g.kx)<3&&Math.abs(g.ky)<3){ g.kx=0; g.ky=0; }
        g.x=Math.max(14,Math.min(world.w-14,g.x));
        g.y=Math.max(14,Math.min(world.h-14,g.y));
      }
    }
    for(const g of ghosts)
      if(Math.hypot(player.x-g.x,player.y-g.y)<PLAYER_R+GHOST_R*0.8){ loseGame(g); return; }

    for(let i=0;i<exits.length;i++){
      const ex=exits[i];
      if(Math.hypot(player.x-ex.x,player.y-ex.y)<PLAYER_R+26){
        if(i===targetIdx){
          // 목표 포인트 통과 → 색 회복
          recovered[ex.ci]=true;
          clearOrder.push(ex.ci);
          recoverFx={x:ex.x, y:ex.y, rgb:ex.color.rgb, ci:ex.ci, t:0};
          SFX.pick();
          exits.splice(i,1);
          cleared++;
          pointerDown=false; moving=false;
          interFromScale=camScale;
          if(exits.length===0){ state='clearing'; stateT=0; SFX.clear(); return; }
          boundsT=boundsFor(cleared);          // 플레이 영역이 실제로 좁아진다
          targetIdx=Math.min(targetIdx, exits.length-1);
          state='interlude'; stateT=0; interApplied=false;
          return;
        } else if(!fizzles.some(f=>f.x===ex.x&&f.y===ex.y)){
          fizzles.push({x:ex.x, y:ex.y, rgb:ex.color.rgb, t:0});
        }
        break;
      }
    }
  }

  // ---------- 그리기 ----------
  // 시각 컨셉: 밝은 석재 바닥 위에 세워진 어두운 석벽.
  // 시야 안에서는 길과 벽이 명도로 확실히 갈리고, 시야 밖에서는 잔광만 남는다.
  function drawFloor(c,bright){
    c.fillStyle = bright ? '#c9c2ae' : '#161a24';
    c.fillRect(0,0,world.w,world.h);
    // 석재 타일 이음새
    c.strokeStyle = bright ? 'rgba(120,112,95,.30)' : 'rgba(120,140,190,.10)';
    c.lineWidth=2;
    for(let x=0;x<=world.w;x+=CELL/2){ c.beginPath(); c.moveTo(x,0); c.lineTo(x,world.h); c.stroke(); }
    for(let y=0;y<=world.h;y+=CELL/2){ c.beginPath(); c.moveTo(0,y); c.lineTo(world.w,y); c.stroke(); }
    if(bright){
      // 타일 얼룩 (질감)
      c.fillStyle='rgba(146,138,120,.18)';
      for(let i=0;i<COLS*2;i++) for(let j=0;j<ROWS*2;j++)
        if((i*7+j*13)%3===0) c.fillRect(i*CELL/2+6, j*CELL/2+6, CELL/2-12, CELL/2-12);
    }
  }

  function drawWalls(c,bright){
    for(const wl of walls){
      if(bright){
        c.fillStyle='rgba(40,32,28,.28)';                 // 바닥에 드리운 그림자
        c.fillRect(wl.x+5, wl.y+7, wl.w, wl.h);
        c.fillStyle='#3a4256';                             // 석벽 본체
        c.fillRect(wl.x,wl.y,wl.w,wl.h);
        c.fillStyle='rgba(126,142,175,.85)';               // 윗면 하이라이트
        c.fillRect(wl.x,wl.y,wl.w,Math.min(6,wl.h*0.35));
        c.fillStyle='rgba(14,17,26,.55)';                  // 아랫면 음영
        c.fillRect(wl.x, wl.y+wl.h-Math.min(5,wl.h*0.3), wl.w, Math.min(5,wl.h*0.3));
        c.strokeStyle='rgba(18,22,34,.9)'; c.lineWidth=1.5;
        c.strokeRect(wl.x,wl.y,wl.w,wl.h);
      } else {
        c.fillStyle='#39435c';
        c.fillRect(wl.x,wl.y,wl.w,wl.h);
      }
    }
  }

  // 색 슬롯: 꺼진 상태는 음각 홈, 회복된 색만 불이 들어온다.
  function drawSlots(c,bright,now){
    for(const sl of slots){
      const on = bright && recovered[sl.ci];
      const col = EXIT_COLORS[sl.ci];
      if(sl.type==='floor'){
        if(on){
          const br=0.55+Math.sin(now/900+sl.rot*3)*0.12;
          const g=c.createRadialGradient(sl.x,sl.y,0,sl.x,sl.y,sl.r*3.2);
          g.addColorStop(0,'rgba('+col.rgb+','+(0.20*br)+')');
          g.addColorStop(1,'rgba('+col.rgb+',0)');
          c.fillStyle=g; c.beginPath(); c.arc(sl.x,sl.y,sl.r*3.2,0,Math.PI*2); c.fill();
          c.strokeStyle='rgba('+col.rgb+','+(0.78*br)+')'; c.lineWidth=2.2;
        } else {
          c.strokeStyle = bright ? 'rgba(126,118,102,.42)' : 'rgba(120,140,190,.10)';
          c.lineWidth=2;
        }
        c.save(); c.translate(sl.x,sl.y); c.rotate(sl.rot);
        c.beginPath(); c.arc(0,0,sl.r,0,Math.PI*2); c.stroke();
        c.beginPath();
        c.moveTo(0,-sl.r*0.52); c.lineTo(sl.r*0.52,0);
        c.lineTo(0,sl.r*0.52); c.lineTo(-sl.r*0.52,0); c.closePath(); c.stroke();
        c.restore();
      } else {
        const x2 = sl.vertical ? sl.x : sl.x+sl.len;
        const y2 = sl.vertical ? sl.y+sl.len : sl.y;
        if(on){
          c.strokeStyle='rgba('+col.rgb+',.85)'; c.lineWidth=3;
          c.beginPath(); c.moveTo(sl.x,sl.y); c.lineTo(x2,y2); c.stroke();
          c.strokeStyle='rgba('+col.rgb+',.22)'; c.lineWidth=9;
          c.beginPath(); c.moveTo(sl.x,sl.y); c.lineTo(x2,y2); c.stroke();
        } else if(bright){
          c.strokeStyle='rgba(12,15,24,.62)'; c.lineWidth=2.5;
          c.beginPath(); c.moveTo(sl.x,sl.y); c.lineTo(x2,y2); c.stroke();
        }
      }
    }
  }

  // 포인트: 응축된 색의 근원 (코어 + 회전하는 결정 조각 + 바닥 문양)
  function drawExitGate(c,x,y,pulse,col,shard){
    const t=pulse+(shard||0);
    // 바닥 문양
    c.strokeStyle='rgba('+col.rgb+',.30)'; c.lineWidth=2;
    c.beginPath(); c.arc(x,y,34+Math.sin(t)*2,0,Math.PI*2); c.stroke();
    // 발광
    const gl=c.createRadialGradient(x,y,0,x,y,74);
    gl.addColorStop(0,'rgba('+col.rgb+',.50)');
    gl.addColorStop(1,'rgba('+col.rgb+',0)');
    c.fillStyle=gl; c.beginPath(); c.arc(x,y,74,0,Math.PI*2); c.fill();
    // 결정 조각 4개
    for(let i=0;i<4;i++){
      const a=t*0.7+i*Math.PI/2;
      const rr=24+Math.sin(t*1.3+i)*2.5;
      const sx=x+Math.cos(a)*rr, sy=y+Math.sin(a)*rr;
      c.save(); c.translate(sx,sy); c.rotate(a);
      c.fillStyle='rgba('+col.rgb+',.85)';
      c.beginPath(); c.moveTo(0,-5); c.lineTo(3.4,0); c.lineTo(0,5); c.lineTo(-3.4,0);
      c.closePath(); c.fill();
      c.restore();
    }
    // 코어
    const cr=11+Math.sin(t*1.6)*1.2;
    c.fillStyle=col.c;
    c.beginPath(); c.arc(x,y,cr,0,Math.PI*2); c.fill();
    c.fillStyle='rgba(255,255,255,.85)';
    c.beginPath(); c.arc(x,y,cr*0.42,0,Math.PI*2); c.fill();
  }

  function drawFizzle(c,f){
    const p=f.t/0.7, a=(1-p)*0.7;
    c.strokeStyle='rgba('+f.rgb+','+a+')'; c.lineWidth=3;
    c.beginPath(); c.arc(f.x,f.y,26+p*18,0,Math.PI*2); c.stroke();
    c.strokeStyle='rgba(160,168,190,'+a+')'; c.lineWidth=3.5;
    const d=14;
    c.beginPath(); c.moveTo(f.x-d,f.y-d); c.lineTo(f.x+d,f.y+d);
    c.moveTo(f.x+d,f.y-d); c.lineTo(f.x-d,f.y+d); c.stroke();
  }
  function drawGhost(c,g){
    const stunned = g.stun>0;
    // 마비 중에는 상하 흔들림이 멈추고 미세하게 떨림
    const wob = stunned ? Math.sin((g.jit||0))*0.9 : Math.sin(g.ph)*2.2;
    const y=g.y+wob;
    if(stunned){
      const k=g.stunMax>0 ? g.stun/g.stunMax : 1;
      // 구속의 고리
      c.strokeStyle='rgba(190,235,255,'+(0.35+0.45*k)+')';
      c.lineWidth=2.5;
      c.beginPath(); c.arc(g.x,y,GHOST_R+7+Math.sin((g.jit||0)*0.4)*1.5,0,Math.PI*2); c.stroke();
      c.strokeStyle='rgba(190,235,255,'+(0.18*k)+')';
      c.lineWidth=1.5;
      c.beginPath(); c.arc(g.x,y,GHOST_R+13,0,Math.PI*2); c.stroke();
      // 전기적인 파편
      c.strokeStyle='rgba(225,245,255,'+(0.55*k)+')';
      c.lineWidth=1.6;
      for(let i=0;i<4;i++){
        const a=(g.jit||0)*0.25+i*Math.PI/2;
        const r1=GHOST_R+4, r2=GHOST_R+11;
        c.beginPath();
        c.moveTo(g.x+Math.cos(a)*r1, y+Math.sin(a)*r1);
        c.lineTo(g.x+Math.cos(a+0.35)*r2, y+Math.sin(a+0.35)*r2);
        c.stroke();
      }
    }
    // 냉기 아우라
    const gr=c.createRadialGradient(g.x,y,0,g.x,y,GHOST_R*3.6);
    if(stunned){ gr.addColorStop(0,'rgba(120,190,235,.42)'); gr.addColorStop(1,'rgba(120,190,235,0)'); }
    else { gr.addColorStop(0,'rgba(60,30,90,.42)'); gr.addColorStop(1,'rgba(60,30,90,0)'); }
    c.fillStyle=gr; c.beginPath(); c.arc(g.x,y,GHOST_R*3.6,0,Math.PI*2); c.fill();
    // 훔친 색의 잔광 — 아직 회복되지 않은 색만 희미하게 남음
    if(!stunned && !recovered[g.ci||0]){
      const col=EXIT_COLORS[g.ci||0];
      const ig=c.createRadialGradient(g.x,y-1,0,g.x,y-1,GHOST_R*0.95);
      ig.addColorStop(0,'rgba('+col.rgb+',.30)');
      ig.addColorStop(1,'rgba('+col.rgb+',0)');
      c.fillStyle=ig; c.beginPath(); c.arc(g.x,y-1,GHOST_R*0.95,0,Math.PI*2); c.fill();
    }
    // 흐릿한 외곽 (석벽의 선명한 직선과 대비)
    c.fillStyle = stunned ? 'rgba(96,110,158,.22)' : 'rgba(38,22,58,.22)';
    c.beginPath(); c.arc(g.x,y,GHOST_R+4.5,0,Math.PI*2); c.fill();
    c.fillStyle = stunned ? 'rgba(96,110,158,.30)' : 'rgba(38,22,58,.32)';
    c.beginPath(); c.arc(g.x,y,GHOST_R+2.2,0,Math.PI*2); c.fill();
    // 몸통 (밝은 바닥과 대비되는 짙은 보랏빛 / 마비 시 창백해짐)
    c.fillStyle = stunned ? 'rgba(96,110,158,.85)' : 'rgba(38,22,58,.88)';
    c.beginPath();
    c.arc(g.x, y-2, GHOST_R, Math.PI, 0);
    c.lineTo(g.x+GHOST_R, y+GHOST_R*0.9);
    for(let i=0;i<3;i++){
      const t=(i+1)/3;
      c.lineTo(g.x+GHOST_R-(GHOST_R*2)*(t-1/6), y+GHOST_R*0.9+(i%2?4:-4));
    }
    c.lineTo(g.x-GHOST_R, y+GHOST_R*0.9);
    c.closePath(); c.fill();
    // 눈 (마비 시 밝게)
    c.fillStyle = stunned ? '#eaf8ff' : '#ffe9a8';
    c.beginPath(); c.arc(g.x-4.5,y-3,2.4,0,Math.PI*2); c.fill();
    c.beginPath(); c.arc(g.x+4.5,y-3,2.4,0,Math.PI*2); c.fill();
  }
  let pStretch=0, pBreath=0, pfx=0, pfy=1;   // 바라보는 방향(보간)
  // ---- B: 반투명한 몸에 빛이 담긴다 ----
  function bBody(c,s2){
    c.beginPath();
    c.moveTo(0,-14*s2);
    c.bezierCurveTo(14*s2,-14*s2, 17*s2,2*s2, 15*s2,11*s2);
    c.bezierCurveTo(13*s2,19*s2, 7*s2,22*s2, 0,22*s2);
    c.bezierCurveTo(-7*s2,22*s2, -13*s2,19*s2, -15*s2,11*s2);
    c.bezierCurveTo(-17*s2,2*s2, -14*s2,-14*s2, 0,-14*s2);
    c.closePath();
  }
  function drawPlayer(c,x,y,scale){
    const S=(scale||1)*0.80;
    const lv=Math.max(0, lightLevel() - pulseDrain/Math.max(LIGHT_VIS_MAX,1));
    const breath=1+Math.sin(pBreath)*0.030*(moving?0.3:1);
    const sx=(1+pStretch*0.20)*breath, sy=(1-pStretch*0.15)*breath;

    // 몸에서 새어 나오는 빛 (담긴 양에 비례)
    const glow=(22+150*lv+40*energy)*S;
    const g=c.createRadialGradient(x,y,0,x,y,glow);
    g.addColorStop(0,'rgba(255,246,214,'+(0.16+0.40*lv+0.12*energy)+')');
    g.addColorStop(1,'rgba(255,246,214,0)');
    c.fillStyle=g; c.beginPath(); c.arc(x,y,glow,0,Math.PI*2); c.fill();

    c.save(); c.translate(x,y); c.scale(S*sx,S*sy);

    // ---- 바라보는 방향 ----
    // 얼굴은 변형하지 않는다. 방향은 부리 > 몸 기울기 > 관성 > 눈동자 순으로 읽힌다.
    const fx=Math.max(-1,Math.min(1,pfx)), fy=Math.max(-1,Math.min(1,pfy));
    c.rotate(fx*0.13);                       // ② 몸의 기울기

    // 발
    const step=moving?Math.sin(pBreath*2.2):0;
    c.fillStyle='#e8a24e';
    const footX=fx*2.6;
    c.save(); c.translate(-6+footX, 21+(moving?Math.max(0,step)*-2.5:0)+fy*1.0);
    c.beginPath(); c.ellipse(0,0,4.6,2.8,fx*0.25,0,Math.PI*2); c.fill(); c.restore();
    c.save(); c.translate( 6+footX, 21+(moving?Math.max(0,-step)*-2.5:0)+fy*1.0);
    c.beginPath(); c.ellipse(0,0,4.6,2.8,fx*0.25,0,Math.PI*2); c.fill(); c.restore();

    // ③ 날개 — 진행 반대쪽으로 흘러 관성을 만든다 (크기는 동일)
    for(const sg of [-1,1]){
      c.save();
      c.translate(sg*14.5-fx*3.0, 6-fy*1.6);
      c.rotate(sg*0.25 - fx*0.42*sg*sg + (moving?step*0.25*sg:0));
      c.fillStyle='rgba(222,216,202,.88)';
      c.beginPath(); c.ellipse(0,0,4.2,8.4+Math.abs(fx)*1.2,0,0,Math.PI*2); c.fill();
      c.restore();
    }

    // 반투명한 몸
    c.fillStyle='rgba(246,244,236,.30)'; bBody(c,1); c.fill();

    // 담긴 빛 — 되찾은 색이 아래에서부터 층으로 쌓인다
    if(clearOrder.length && bodyEmpty<0.999){
      c.save(); bBody(c,1); c.clip();
      const n=clearOrder.length, span=36*(1-bodyEmpty);
      for(let i=0;i<n;i++){
        const col=EXIT_COLORS[clearOrder[i]];
        const y1=22-i*(span/EXIT_COLORS.length);
        const y0=22-(i+1)*(span/EXIT_COLORS.length);
        const lg=c.createLinearGradient(0,y0,0,y1);
        lg.addColorStop(0,'rgba('+col.rgb+',.62)');
        lg.addColorStop(1,'rgba('+col.rgb+',.34)');
        c.fillStyle=lg; c.fillRect(-18,y0,36,(y1-y0)+1);
      }
      const top=22-n*(span/EXIT_COLORS.length);
      c.fillStyle='rgba(255,255,245,.60)';
      c.fillRect(-18,top-0.8+Math.sin(pBreath*1.3)*0.7,36,1.5);
      if(pulseDrain>0){   // Pulse 직후: 담긴 빛이 흐려짐
        c.fillStyle='rgba(16,20,32,'+(0.45*Math.min(1,pulseDrain/LIGHT_VIS_MAX))+')';
        c.fillRect(-18,-24,36,50);
      }
      c.restore();
    }

    // 빛의 씨앗 — 기척이 가까우면 아주 미세하게 흔들린다
    let tellMax=0;
    if(typeof ghosts!=='undefined' && ghosts) for(const g of ghosts) if((g.tell||0)>tellMax) tellMax=g.tell;
    const flick = 1 - tellMax*0.16*Math.abs(Math.sin(pBreath*3.3));
    const sg2=c.createRadialGradient(0,4,0,0,4,11*flick);
    sg2.addColorStop(0,'rgba(255,252,235,'+((0.5+0.4*lv)*flick)+')'); sg2.addColorStop(1,'rgba(255,252,235,0)');
    c.fillStyle=sg2; c.beginPath(); c.arc(0,4,11*flick,0,Math.PI*2); c.fill();

    // 유리 윤곽
    c.strokeStyle='rgba(255,253,246,.85)'; c.lineWidth=2; bBody(c,1); c.stroke();
    c.fillStyle='rgba(255,255,255,.42)';
    c.beginPath(); c.ellipse(-6,-3,3.6,6.4,-0.3,0,Math.PI*2); c.fill();

    // ---- 얼굴: 크기와 형태는 항상 동일하게 유지 ----
    const eyeY=-5+fy*2.4;
    const R=4.5, sep=6.1;
    for(const sg of [-1,1]){
      const ex=sg*sep+fx*1.6;                 // 두 눈이 함께 아주 살짝 이동
      c.fillStyle='#ffffff';
      c.beginPath(); c.ellipse(ex,eyeY,R,R*1.05,0,0,Math.PI*2); c.fill();
      // ④ 눈동자만 바라보는 쪽으로
      c.fillStyle='#252836';
      c.beginPath(); c.ellipse(ex+fx*1.9, eyeY+0.6+fy*1.3, 2.8,3.2,0,0,Math.PI*2); c.fill();
      c.fillStyle='rgba(255,255,255,.95)';
      c.beginPath(); c.arc(ex-1.1+fx*1.0, eyeY-1.3+fy*0.8, 1.2,0,Math.PI*2); c.fill();
    }
    // ① 부리 — 방향을 가장 크게 알려주는 요소
    const bx=fx*6.2, by=eyeY+5.2+fy*2.6;
    c.save(); c.translate(bx,by); c.rotate(fx*1.05 + (fy<0? -fy*0.35:0));
    c.fillStyle='#e8a24e';
    c.beginPath(); c.moveTo(0,-0.6);
    c.quadraticCurveTo(2.7,1.5, 0,4.4);
    c.quadraticCurveTo(-2.7,1.5, 0,-0.6);
    c.closePath(); c.fill();
    c.restore();

    c.restore();
  }

  // Pulse 파동 (월드 좌표)
  function drawPulse(c,p){
    const k=p.t/0.75;
    const r=p.R*(0.15+0.85*Math.min(1,k*1.25));
    const a=(1-k)*(0.55+0.35*p.e);
    c.strokeStyle='rgba(255,252,235,'+a+')';
    c.lineWidth=(9+16*p.e)*(1-k)+1.5;
    c.beginPath(); c.arc(player.x,player.y,r,0,Math.PI*2); c.stroke();
    c.strokeStyle='rgba(190,225,255,'+(a*0.55)+')';
    c.lineWidth=(4+8*p.e)*(1-k)+1;
    c.beginPath(); c.arc(player.x,player.y,r*0.72,0,Math.PI*2); c.stroke();
  }

  // 색 회복 연출: 포인트 → 플레이어 → 세계
  function drawRecoverFx(c, fx, fy, z, psx, psy){
    if(!recoverFx) return;
    const t=recoverFx.t, rgb=recoverFx.rgb;
    const sx=W/2+(recoverFx.x-fx)*z, sy=H/2+(recoverFx.y-fy)*z;

    // ① 흡수: 포인트에서 플레이어로 이어지는 한 줄기 흐름
    if(t<INTER_ABSORB){
      const k=t/INTER_ABSORB;
      const ex=sx+(psx-sx)*k, ey=sy+(psy-sy)*k;
      c.strokeStyle='rgba('+rgb+','+(0.85*(1-k*0.35))+')';
      c.lineWidth=(5-3*k)*Math.max(z,0.4);
      c.beginPath(); c.moveTo(sx,sy); c.lineTo(ex,ey); c.stroke();
      const g=c.createRadialGradient(ex,ey,0,ex,ey,26*Math.max(z,0.4));
      g.addColorStop(0,'rgba('+rgb+',.9)'); g.addColorStop(1,'rgba('+rgb+',0)');
      c.fillStyle=g; c.beginPath(); c.arc(ex,ey,26*Math.max(z,0.4),0,Math.PI*2); c.fill();
      // 남은 코어가 점점 작아짐
      c.fillStyle='rgba('+rgb+','+(1-k)+')';
      c.beginPath(); c.arc(sx,sy,11*(1-k)*Math.max(z,0.4),0,Math.PI*2); c.fill();
    }
    // ② 수용 + ③ 전파: 작은 파문이 한 번 퍼진다
    const tp=t-INTER_ABSORB;
    if(tp>0 && tp<0.9){
      const k=tp/0.9;
      const r=(40+520*k)*Math.max(z,0.35);
      c.strokeStyle='rgba('+rgb+','+((1-k)*0.55)+')';
      c.lineWidth=(6*(1-k)+1)*Math.max(z,0.4);
      c.beginPath(); c.arc(psx,psy,r,0,Math.PI*2); c.stroke();
      const g=c.createRadialGradient(psx,psy,0,psx,psy,60*Math.max(z,0.4));
      g.addColorStop(0,'rgba('+rgb+','+((1-k)*0.5)+')');
      g.addColorStop(1,'rgba('+rgb+',0)');
      c.fillStyle=g; c.beginPath(); c.arc(psx,psy,60*Math.max(z,0.4),0,Math.PI*2); c.fill();
    }
  }

  // 첫 포인트의 위치를 아주 희미하게만 알려준다 (게임 시작 직후 한동안)
  function drawBeacon(c, z, force){
    if(!exits.length) return;
    const a0 = force!==undefined ? force : Math.min(1, beaconT/9.0);
    if(a0<=0.01) return;
    const tg=exits[targetIdx];
    let sx=W/2+(tg.x-player.x)*z, sy=H/2+(tg.y-player.y)*z;
    const m=34, off=(sx<m||sx>W-m||sy<m||sy>H-m);
    if(off){
      const dx=sx-W/2, dy=sy-H/2;
      const k=Math.min((W/2-m)/Math.max(1e-6,Math.abs(dx)), (H/2-m)/Math.max(1e-6,Math.abs(dy)));
      sx=W/2+dx*k; sy=H/2+dy*k;
    }
    const pa=(0.45+0.55*Math.sin(performance.now()/620))*a0;
    const R=off?16:26;
    const g=c.createRadialGradient(sx,sy,0,sx,sy,R*2.4);
    g.addColorStop(0,'rgba('+tg.color.rgb+','+(0.40*pa)+')');
    g.addColorStop(1,'rgba('+tg.color.rgb+',0)');
    c.fillStyle=g; c.beginPath(); c.arc(sx,sy,R*2.4,0,Math.PI*2); c.fill();
    c.fillStyle='rgba(255,255,255,'+(0.55*pa)+')';
    c.beginPath(); c.arc(sx,sy,2.6,0,Math.PI*2); c.fill();
  }

  // 시야 밖 유령의 대략적인 방향을 캐릭터 주변에 짧게 표시
  function drawTells(c, z){
    // 캐릭터가 '느끼는' 것이므로 몸 바로 주변에 표시한다
    const baseR = 30*z + 6;
    // 화면이 호로 뒤덮이지 않도록 가장 가까운 3마리만
    const cand=ghosts.filter(g=>(g.tell||0)>0.12)
                     .sort((a,b)=>(b.tell||0)-(a.tell||0)).slice(0,3);
    for(const g of cand){
      const w=g.tell||0;
      // 깜빡임: 항상 보이지 않고 순간적으로 스친다
      const blink=0.35+0.65*Math.max(0, Math.sin(g.tellPh*1.9));
      const a=Math.min(TELL_MAX_A, Math.pow(w,0.9)*TELL_MAX_A)*blink;
      if(a<0.02) continue;
      const ang=Math.atan2(g.y-player.y, g.x-player.x) + Math.sin(g.tellJit)*0.22;
      const r=baseR + (1-w)*7;
      const span=0.40+0.30*w;
      c.save();
      c.lineCap='round';
      const lw=2.6+2.6*w;
      // 어두운 외곽 — 밝은 바닥 위에서 형태를 잡아준다
      c.strokeStyle='rgba(10,14,28,'+(a*0.85)+')';
      c.lineWidth=lw+3.2;
      c.beginPath(); c.arc(W/2,H/2, r, ang-span/2, ang+span/2); c.stroke();
      // 밝은 심 — 어둠 속에서 확실히 보인다
      c.strokeStyle='rgba(238,250,255,'+a+')';
      c.lineWidth=lw;
      c.beginPath(); c.arc(W/2,H/2, r, ang-span/2, ang+span/2); c.stroke();
      if(w>0.55){
        c.strokeStyle='rgba(10,14,28,'+(a*0.45)+')'; c.lineWidth=3.4;
        c.beginPath(); c.arc(W/2,H/2, r+7+3*w, ang-span*0.34, ang+span*0.34); c.stroke();
        c.strokeStyle='rgba(222,244,255,'+(a*0.6)+')'; c.lineWidth=1.6;
        c.beginPath(); c.arc(W/2,H/2, r+7+3*w, ang-span*0.34, ang+span*0.34); c.stroke();
      }
      c.lineCap='butt';
      c.restore();
    }
  }

  // 좌상단 에너지 링 (유일한 HUD 요소)
  function drawEnergyRing(c,cx,cy){
    const R=21;
    const full = energy>=0.999;
    const breathe = full ? 1+Math.sin(performance.now()/220)*0.035 : 1;
    c.save();
    c.translate(cx,cy); c.scale(breathe,breathe);
    // 미완성 원 (얇은 테두리)
    c.strokeStyle='rgba(232,236,248,.20)'; c.lineWidth=3;
    c.beginPath(); c.arc(0,0,R,0,Math.PI*2); c.stroke();
    // 차오르는 부분
    if(energy>0.001){
      c.strokeStyle = full ? 'rgba(255,253,242,.98)' : 'rgba(214,232,255,.85)';
      c.lineWidth=4;
      c.lineCap='round';
      c.beginPath(); c.arc(0,0,R,-Math.PI/2, -Math.PI/2+Math.PI*2*energy); c.stroke();
      c.lineCap='butt';
    }
    // 내부 은은한 빛
    const g=c.createRadialGradient(0,0,0,0,0,R*1.5);
    g.addColorStop(0,'rgba(220,238,255,'+(0.05+0.30*energy)+')');
    g.addColorStop(1,'rgba(220,238,255,0)');
    c.fillStyle=g; c.beginPath(); c.arc(0,0,R*1.5,0,Math.PI*2); c.fill();
    // 중심 점 (충전량에 따라 커짐)
    c.fillStyle='rgba(255,253,242,'+(0.35+0.6*energy)+')';
    c.beginPath(); c.arc(0,0,2+4.5*energy,0,Math.PI*2); c.fill();
    if(full){
      c.strokeStyle='rgba(255,253,242,.35)'; c.lineWidth=1.5;
      c.beginPath(); c.arc(0,0,R+5,0,Math.PI*2); c.stroke();
    }
    c.restore();
  }

  function drawBoundary(c,bright){
    const b=bounds;
    // 영역 밖은 어둠으로 덮는다
    c.fillStyle = bright ? 'rgba(8,10,18,.92)' : 'rgba(6,8,14,.85)';
    c.fillRect(-400, -400, world.w+800, b.y0+400);
    c.fillRect(-400, b.y1, world.w+800, world.h-b.y1+400);
    c.fillRect(-400, b.y0, b.x0+400, b.y1-b.y0);
    c.fillRect(b.x1, b.y0, world.w-b.x1+400, b.y1-b.y0);
    // 경계선
    if(bright){
      c.strokeStyle='rgba(150,190,255,.55)'; c.lineWidth=5;
      c.strokeRect(b.x0,b.y0,b.x1-b.x0,b.y1-b.y0);
      c.strokeStyle='rgba(190,220,255,.18)'; c.lineWidth=14;
      c.strokeRect(b.x0,b.y0,b.x1-b.x0,b.y1-b.y0);
    } else {
      c.strokeStyle='rgba(140,170,235,.45)'; c.lineWidth=5;
      c.strokeRect(b.x0,b.y0,b.x1-b.x0,b.y1-b.y0);
    }
  }

  function drawWorldLayer(c,opts){
    drawFloor(c,opts.bright);
    c.strokeStyle=opts.bright?'rgba(58,66,86,.95)':'rgba(120,150,210,.45)';
    c.lineWidth=10; c.strokeRect(0,0,world.w,world.h);
    drawSlots(c,opts.bright,opts.now||0);
    drawWalls(c,opts.bright);
    for(const ex of exits) drawExitGate(c,ex.x,ex.y,opts.pulse,ex.color,ex.shard);
    if(opts.showEntities){
      for(const f of fizzles) drawFizzle(c,f);
      for(const g of ghosts) drawGhost(c,g);
      for(const p of pulses) drawPulse(c,p);
    }
    drawBoundary(c,opts.bright);
  }

  function applyVisionMask(c,cx,cy,rPx){
    c.globalCompositeOperation='destination-in';
    const outer=rPx*FALLOFF_SCALE;
    const g=c.createRadialGradient(cx,cy,0,cx,cy,outer);
    g.addColorStop(0.00,'rgba(0,0,0,1)');
    g.addColorStop(0.55,'rgba(0,0,0,1)');
    g.addColorStop(0.72,'rgba(0,0,0,.80)');
    g.addColorStop(0.84,'rgba(0,0,0,.42)');
    g.addColorStop(0.93,'rgba(0,0,0,.16)');
    g.addColorStop(1.00,'rgba(0,0,0,0)');
    c.fillStyle=g; c.fillRect(0,0,W,H);
    c.globalCompositeOperation='source-over';
  }

  function render(now){
    ctx.fillStyle='#04050a'; ctx.fillRect(0,0,W,H);
    if(state==='idle') return;
    const pulse=now/450;

    // ---- 인트로 ----
    if(state==='awaken'){
      const t=stateT;
      const ez=(p)=>Math.max(0,Math.min(1,p))*Math.max(0,Math.min(1,p))*(3-2*Math.max(0,Math.min(1,p)));
      const fit=Math.min(W/world.w, H/world.h)*0.92;
      const T1=AW.char, T2=T1+AW.out, T3=T2+AW.map, T4=T3+AW.in, T5=T4+AW.text;

      let z=ZOOM_BASE, fx=player.x, fy=player.y, reveal=0, charA=0;
      if(t<T1){                                   // ① 어둠 속에서 주인공이 떠오른다
        charA=ez((t-AW.char*0.13)/Math.max(0.2,AW.char*0.74));
      } else if(t<T2){                            // ② 전체 맵으로 물러난다
        const k=ez((t-T1)/AW.out);
        z=ZOOM_BASE+(fit-ZOOM_BASE)*k;
        fx=player.x+(world.w/2-player.x)*k;
        fy=player.y+(world.h/2-player.y)*k;
        reveal=k; charA=1;
      } else if(t<T3){                            // ③ 세계 전체를 보여준다
        z=fit; fx=world.w/2; fy=world.h/2; reveal=1; charA=1;
      } else if(t<T4){                            // ④ 다시 주인공에게 돌아온다
        const k=ez((t-T3)/AW.in);
        z=fit+(ZOOM_BASE-fit)*k;
        fx=world.w/2+(player.x-world.w/2)*k;
        fy=world.h/2+(player.y-world.h/2)*k;
        reveal=1-k; charA=1;
      } else { charA=1; }                          // ⑤⑥ 문장 → 색 깜빡임

      const cx=W/2, cy=H/2;
      // 잔광
      ctx.save(); ctx.globalAlpha=AMBIENT*Math.max(charA,reveal);
      ctx.translate(cx,cy); ctx.scale(z,z); ctx.translate(-fx,-fy);
      drawWorldLayer(ctx,{bright:false, pulse:pulse, showEntities:false, now:now});
      ctx.restore();
      // 밝은 층 + 시야
      lctx.setTransform(DPR,0,0,DPR,0,0); lctx.clearRect(0,0,W,H);
      lctx.save();
      lctx.translate(cx,cy); lctx.scale(z,z); lctx.translate(-fx,-fy);
      drawWorldLayer(lctx,{bright:true, pulse:pulse, showEntities:false, now:now});
      lctx.restore();
      const baseR=visionRadius()*z*(t<T1?ez((t-AW.char*0.26)/Math.max(0.2,AW.char*0.7)):1);
      applyVisionMask(lctx, cx, cy, Math.max(18, baseR+(Math.max(W,H)*1.7-baseR)*reveal));
      ctx.drawImage(lit,0,0,W,H);

      // 주인공
      const psx=cx+(player.x-fx)*z, psy=cy+(player.y-fy)*z;
      ctx.save(); ctx.globalAlpha=charA;
      drawPlayer(ctx, psx, psy, Math.max(z,0.5));
      ctx.restore();

      // ⑤ 문장
      if(t>T4 && AW.text>0){
        const fa=Math.min(1,(t-T4)/0.45)*Math.min(1,(AWAKEN_T+0.2-t)/0.6);
        if(fa>0){
          ctx.save(); ctx.globalAlpha=Math.max(0,fa); ctx.textAlign='center';
          ctx.fillStyle='rgba(6,8,14,.8)'; ctx.font='700 21px "Space Grotesk", sans-serif';
          ctx.fillText('색을 찾아라', cx+1, H*0.80+1);
          ctx.fillStyle='#f4ede0';
          ctx.fillText('색을 찾아라', cx, H*0.80);
          ctx.restore();
        }
      }
      // ⑥ 찾아야 할 색이 깜빡인다
      if(t>T5 && exits.length) drawBeacon(ctx, z, Math.min(1,(t-T5)/0.4));
      return;
    }

    // ---- 엔딩: 색을 세계로 돌려주고, 세계가 다시 넓어진다 ----
    if(state==='ending'){
      const t=stateT;
      const gather=Math.min(1, t/1.2);                     // ① 일곱 색이 모인다
      const flare =Math.max(0, Math.min(1,(t-1.2)/0.4));   // ② 잠시 밝아진다
      const spread=Math.max(0, Math.min(1,(t-1.6)/1.4));   // ③ 사방으로 퍼진다
      const openW =Math.max(0, Math.min(1,(t-2.6)/3.2));   // ④ 세계가 넓어진다
      bodyEmpty=spread;

      // 카메라: 플레이어 시점 → 세계 전체
      const fit=Math.min(W/world.w, H/world.h)*0.92;
      const ez=(p)=>p*p*(3-2*p);
      const k=ez(openW);
      const z=ZOOM_BASE+(fit-ZOOM_BASE)*k;
      const fx=player.x+(world.w/2-player.x)*k;
      const fy=player.y+(world.h/2-player.y)*k;
      const cx=W/2, cy=H/2;

      // 세계 — 어둠이 걷히고 색 슬롯이 모두 켜진 상태로 드러난다
      ctx.save();
      ctx.globalAlpha=AMBIENT+(1-AMBIENT)*Math.min(1,k*1.2);
      ctx.translate(cx,cy); ctx.scale(z,z); ctx.translate(-fx,-fy);
      drawWorldLayer(ctx,{bright:true, pulse:pulse, showEntities:false, now:now});
      ctx.restore();

      // 아직 넓어지기 전에는 시야 마스크가 남아 있다
      if(k<0.999){
        lctx.setTransform(DPR,0,0,DPR,0,0); lctx.clearRect(0,0,W,H);
        lctx.fillStyle='#04050a'; lctx.fillRect(0,0,W,H);
        lctx.globalCompositeOperation='destination-out';
        const gm=lctx.createRadialGradient(cx,cy,0,cx,cy,
          (visionRadius()*z*FALLOFF_SCALE)+(Math.max(W,H)*1.6)*k);
        gm.addColorStop(0,'rgba(0,0,0,1)'); gm.addColorStop(0.7,'rgba(0,0,0,1)');
        gm.addColorStop(1,'rgba(0,0,0,0)');
        lctx.fillStyle=gm; lctx.fillRect(0,0,W,H);
        lctx.globalCompositeOperation='source-over';
        ctx.save(); ctx.globalAlpha=1-k*0.9; ctx.drawImage(lit,0,0,W,H); ctx.restore();
      }

      // 일곱 색의 고리 — 모였다가 세계로 퍼져나간다
      const psx=cx+(player.x-fx)*z, psy=cy+(player.y-fy)*z;
      for(let i=0;i<EXIT_COLORS.length;i++){
        const col=EXIT_COLORS[clearOrder[i]!==undefined?clearOrder[i]:i];
        const a0=-Math.PI/2+(i/7)*Math.PI*2, a1=-Math.PI/2+((i+1)/7)*Math.PI*2;
        const R0=(150-104*gather)*Math.max(z,0.5) + spread*spread*Math.max(W,H)*0.9;
        const a = spread>0 ? (1-spread)*0.8 : (0.25+0.6*gather);
        if(a<=0.01) continue;
        ctx.strokeStyle='rgba('+col.rgb+','+a+')';
        ctx.lineWidth=(4+7*gather)*(1-spread*0.7)+1; ctx.lineCap='round';
        ctx.beginPath(); ctx.arc(psx,psy,Math.max(4,R0),a0+0.06,a1-0.06); ctx.stroke();
      }
      ctx.lineCap='butt';

      if(flare>0){
        const f=flare*(1-spread);
        const g=ctx.createRadialGradient(psx,psy,0,psx,psy,240);
        g.addColorStop(0,'rgba(255,252,238,'+(0.55*f)+')');
        g.addColorStop(1,'rgba(255,252,238,0)');
        ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
      }

      drawPlayer(ctx,psx,psy,Math.max(z,0.55)*1.25);

      const fa=Math.max(0, Math.min(1,(t-5.2)/0.9));
      if(fa>0){
        ctx.save(); ctx.globalAlpha=fa; ctx.textAlign='center';
        ctx.fillStyle='rgba(6,8,14,.6)';
        ctx.font='500 16px "Space Grotesk", sans-serif';
        ctx.fillText('일곱 색을 모두 돌려주었다', W/2+1, H*0.845+1);
        ctx.fillStyle='#f4ede0';
        ctx.fillText('일곱 색을 모두 돌려주었다', W/2, H*0.845);
        ctx.fillStyle='rgba(6,8,14,.6)'; ctx.font='400 13px "Space Grotesk", sans-serif';
        ctx.fillText('세계는 다시 넓어지고, 나는 다시 비어 있다', W/2+1, H*0.875+1);
        ctx.fillStyle='rgba(214,210,224,.95)';
        ctx.fillText('세계는 다시 넓어지고, 나는 다시 비어 있다', W/2, H*0.875);
        ctx.restore();
      }
      return;
    }

    if(state==='clearing'){
      // 7색을 모두 되찾은 순간: 어둠이 걷히고 세계가 드러난다
      const fit=Math.min(W/world.w,H/world.h)*0.94;
      const ease=(t)=>t*t*(3-2*t);
      const k=ease(Math.min(1,stateT/1.0));
      const z=interFromScale+(fit-interFromScale)*k;
      const fx=player.x+(world.w/2-player.x)*k;
      const fy=player.y+(world.h/2-player.y)*k;

      ctx.save();
      ctx.globalAlpha=AMBIENT;
      ctx.translate(W/2,H/2); ctx.scale(z,z); ctx.translate(-fx,-fy);
      drawWorldLayer(ctx,{bright:false, pulse:pulse, showEntities:false, now:now});
      ctx.restore();

      lctx.setTransform(DPR,0,0,DPR,0,0);
      lctx.clearRect(0,0,W,H);
      lctx.save();
      lctx.translate(W/2,H/2); lctx.scale(z,z); lctx.translate(-fx,-fy);
      drawWorldLayer(lctx,{bright:true, pulse:pulse, showEntities:true, now:now});
      // 무지개 순서대로 슬롯이 한 번씩 밝아지는 물결
      const wave=(stateT-0.35)/1.5;
      if(wave>0){
        for(const sl of slots){
          const d=Math.abs(wave*7-(sl.ci+0.5));
          if(d>0.5) continue;
          const a=(1-d*2)*0.8;
          const col=EXIT_COLORS[sl.ci];
          const g2=lctx.createRadialGradient(sl.x,sl.y,0,sl.x,sl.y,54);
          g2.addColorStop(0,'rgba('+col.rgb+','+a+')');
          g2.addColorStop(1,'rgba('+col.rgb+',0)');
          lctx.fillStyle=g2; lctx.beginPath(); lctx.arc(sl.x,sl.y,54,0,Math.PI*2); lctx.fill();
        }
      }
      lctx.restore();
      const baseR2=visionRadius()*z;
      const openR2=baseR2+(Math.max(W,H)*2.0-baseR2)*k;
      applyVisionMask(lctx,W/2,H/2,openR2);
      ctx.drawImage(lit,0,0,W,H);

      const psx2=W/2+(player.x-fx)*z, psy2=H/2+(player.y-fy)*z;
      drawRecoverFx(ctx, fx, fy, z, psx2, psy2);
      drawPlayer(ctx,psx2,psy2,Math.max(z,0.55));
      return;
    }

    if(state==='interlude'){
      const fit=Math.min(W/world.w,H/world.h)*0.94;
      let k, z, fx, fy, reveal;
      const ease=(t)=>t*t*(3-2*t);
      const tA=stateT-INTER_ABSORB;
      if(stateT<INTER_ABSORB){
        // ① 흡수 — 카메라는 플레이어에 머무름
        z=interFromScale; fx=player.x; fy=player.y; reveal=0;
      } else if(tA<INTER_OUT){
        k=ease(tA/INTER_OUT);
        z=interFromScale+(fit-interFromScale)*k;
        fx=player.x+(world.w/2-player.x)*k;
        fy=player.y+(world.h/2-player.y)*k;
        reveal=k;
      } else if(tA<INTER_OUT+INTER_HOLD_T){
        z=fit; fx=world.w/2; fy=world.h/2; reveal=1;
      } else {
        k=ease((tA-INTER_OUT-INTER_HOLD_T)/INTER_IN);
        z=fit+(interFromScale-fit)*k;
        fx=world.w/2+(player.x-world.w/2)*k;
        fy=world.h/2+(player.y-world.h/2)*k;
        reveal=1-k;
      }

      // 잔광 레이어
      ctx.save();
      ctx.globalAlpha=AMBIENT;
      ctx.translate(W/2,H/2); ctx.scale(z,z); ctx.translate(-fx,-fy);
      drawWorldLayer(ctx,{bright:false, pulse:pulse, showEntities:false, now:now});
      ctx.restore();

      // 밝은 레이어 — reveal 만큼 마스크가 열림
      lctx.setTransform(DPR,0,0,DPR,0,0);
      lctx.clearRect(0,0,W,H);
      lctx.save();
      lctx.translate(W/2,H/2); lctx.scale(z,z); lctx.translate(-fx,-fy);
      drawWorldLayer(lctx,{bright:true, pulse:pulse, showEntities:true, now:now});
      lctx.restore();
      const baseR=visionRadius()*z;
      const openR=baseR+(Math.max(W,H)*1.9-baseR)*reveal;
      applyVisionMask(lctx,W/2,H/2,openR);
      ctx.drawImage(lit,0,0,W,H);

      // 플레이어 (전체 맵 상의 현재 위치)
      const psx=W/2+(player.x-fx)*z, psy=H/2+(player.y-fy)*z;
      drawRecoverFx(ctx, fx, fy, z, psx, psy);
      drawPlayer(ctx,psx,psy,Math.max(z,0.55));

      // 진행도 표시
      const ta = tA<0 ? 0
               : (tA<INTER_OUT ? (tA/INTER_OUT)
               : (tA<INTER_OUT+INTER_HOLD_T ? 1
                  : Math.max(0,1-(tA-INTER_OUT-INTER_HOLD_T)/(INTER_IN*0.7))));
      if(ta>0){
        ctx.save();
        ctx.globalAlpha=ta;
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.font='700 '+Math.round(Math.min(W,H)*0.13)+'px "Space Grotesk", sans-serif';
        ctx.fillStyle='rgba(6,8,14,.55)';
        ctx.fillText(cleared+' / '+totalPoints, W/2+2, H/2+3);
        ctx.fillStyle='#fffdf2';
        ctx.fillText(cleared+' / '+totalPoints, W/2, H/2);
        ctx.restore();
      }

      drawEnergyRing(ctx, 44, 96);
      return;
    }

    if(state==='playing'||state==='result'||state==='paused'||state==='gameover'){
      const z=camScale;
      const vrPx=visionRadius()*z;

      ctx.save();
      ctx.globalAlpha=AMBIENT;
      ctx.translate(W/2,H/2); ctx.scale(z,z); ctx.translate(-player.x,-player.y);
      drawWorldLayer(ctx,{bright:false, pulse:pulse, showEntities:false, now:now});
      ctx.restore();

      lctx.setTransform(DPR,0,0,DPR,0,0);
      lctx.clearRect(0,0,W,H);
      lctx.save();
      lctx.translate(W/2,H/2); lctx.scale(z,z); lctx.translate(-player.x,-player.y);
      drawWorldLayer(lctx,{bright:true, pulse:pulse, showEntities:true, now:now});
      lctx.restore();
      applyVisionMask(lctx,W/2,H/2,vrPx);
      ctx.drawImage(lit,0,0,W,H);

      drawPlayer(ctx,W/2,H/2,z);

      if(beaconT>0 && cleared===0) drawBeacon(ctx, z);
      // 첫 위기: 두 번 탭하는 동작을 캐릭터 아래에 그려서 보여준다
      if(pulsePrompt>0.02 && !pulseTaught){
        const a=pulsePrompt, cx2=W/2, cy2=H/2+82;
        const cyc=(pulsePromptPh%2.2);
        for(let i=0;i<2;i++){
          const t2=cyc-i*0.42;
          if(t2<0||t2>0.62) continue;
          const k=t2/0.62;
          ctx.strokeStyle='rgba(238,250,255,'+((1-k)*0.85*a)+')';
          ctx.lineWidth=2.4;
          ctx.beginPath(); ctx.arc(cx2,cy2,10+22*k,0,Math.PI*2); ctx.stroke();
        }
        ctx.fillStyle='rgba(10,14,28,'+(0.55*a)+')';
        ctx.beginPath(); ctx.arc(cx2,cy2,13,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='rgba(238,250,255,'+(0.92*a)+')';
        ctx.beginPath(); ctx.arc(cx2,cy2,9.5,0,Math.PI*2); ctx.fill();
        // 두 번이라는 것을 점 두 개로
        ctx.fillStyle='rgba(20,24,40,'+(0.9*a)+')';
        ctx.beginPath(); ctx.arc(cx2-3.2,cy2,1.7,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(cx2+3.2,cy2,1.7,0,Math.PI*2); ctx.fill();
      }

      // 시야 밖 유령의 기척 — 캐릭터 주변에 대략적인 방향만 짧게 스친다
      drawTells(ctx, z);

      // 좌상단 에너지 링
      const topInset = 96;
      if(state!=='gameover') drawEnergyRing(ctx, 44, topInset);

      // ---- 잡히는 순간의 연출 ----
      if(state==='gameover'){
        const k=Math.min(1, stateT/GAMEOVER_T);
        // 어둠이 안쪽으로 조여든다
        const R=Math.max(W,H);
        const g=ctx.createRadialGradient(W/2,H/2,R*0.42*(1-k*0.92),W/2,H/2,R*0.85*(1-k*0.55));
        g.addColorStop(0,'rgba(6,7,12,0)');
        g.addColorStop(1,'rgba(6,7,12,'+(0.55+0.45*k)+')');
        ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
        // 삼켜지는 보랏빛
        ctx.fillStyle='rgba(44,20,70,'+(0.30*k)+')'; ctx.fillRect(0,0,W,H);
        // 캐릭터의 빛이 꺼진다
        const f=1-k;
        const pg=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,60*f+8);
        pg.addColorStop(0,'rgba(255,248,220,'+(0.55*f)+')');
        pg.addColorStop(1,'rgba(255,248,220,0)');
        ctx.fillStyle=pg; ctx.beginPath(); ctx.arc(W/2,H/2,60*f+8,0,Math.PI*2); ctx.fill();
      }

      // ---- 일시정지: 화면을 살짝 가라앉힌다 ----
      if(state==='paused'){
        ctx.fillStyle='rgba(6,7,12,.35)'; ctx.fillRect(0,0,W,H);
      }

      if(screenFlash){
        const p=screenFlash.t/SCREEN_FLASH_DUR;
        const a=(p<0.15)?(p/0.15)*0.42:0.42*Math.pow(1-(p-0.15)/0.85,1.7);
        ctx.fillStyle='rgba('+screenFlash.rgb+','+a+')';
        ctx.fillRect(0,0,W,H);
        const g=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*0.75);
        g.addColorStop(0,'rgba('+screenFlash.rgb+',0)');
        g.addColorStop(1,'rgba('+screenFlash.rgb+','+(a*0.9)+')');
        ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
      }
    }
  }

  let lastTime=null;
  // 오류가 나도 게임이 멈추지 않게 하고, 실제 메시지를 화면에 남긴다
  let errShown=false;
  function showErr(msg){
    if(errShown) return; errShown=true;
    const d=document.createElement('div');
    d.style.cssText='position:fixed;left:8px;right:8px;bottom:8px;z-index:99;padding:10px 12px;'+
      'background:rgba(60,10,20,.92);color:#ffd7d7;font:12px/1.4 monospace;border-radius:10px;'+
      'white-space:pre-wrap;word-break:break-all;';
    d.textContent='ERR: '+msg;
    document.body.appendChild(d);
  }
  window.addEventListener('error', e=>showErr((e.message||'?')+' @'+(e.lineno||'?')));
  window.addEventListener('unhandledrejection', e=>showErr('promise: '+e.reason));

  function loop(now){
    if(lastTime===null) lastTime=now;
    const dt=Math.min(.033,(now-lastTime)/1000);
    lastTime=now;
    try{ update(dt); updateHum(); }catch(e){ showErr('update: '+e.message); }
    try{ render(now); }catch(e){ showErr('render: '+e.message); }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
